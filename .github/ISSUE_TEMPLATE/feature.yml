name: Feature
description: A user-facing feature or story from PROJECT.md
title: 'feat(<area>): '
labels: ['type:feat']
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist taken from PROJECT.md section 4.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and notes
      description: Affected projects, contracts, design references (docs/design/…), security items from 5.8.
  - type: input
    id: ref
    attributes:
      label: PROJECT.md reference
      placeholder: 'e.g. 4 › story 3, 6.2'
