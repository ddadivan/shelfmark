name: CI

# `stage` is the integration branch of the current stage (PROJECT.md 9.3): feature PRs target it,
# and `main` only gets release PRs from `stage` and hotfixes.
on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]

# Deny by default; each job grants only what it needs.
permissions: {}

env:
  SCARF_ANALYTICS: 'false'
  NX_NO_CLOUD: 'true'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test-build:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # Real Postgres for the migration check only (ADR 0025); unit tests use in-memory PGlite.
    # Trust auth: the container is reachable from this job only and holds no data.
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-lint-${{ runner.os }}-
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - run: npm run format:check
      - run: npm run lint:styles
      # ADR 0020: every dependency install script needs an explicit allowScripts decision.
      # `npm install-scripts ls` exits 0 either way, so check its output.
      - name: Check npm install scripts are reviewed
        run: |
          out="$(npm install-scripts ls)"
          echo "$out"
          grep -q 'No packages with unreviewed install scripts' <<<"$out" || {
            echo "::error::A dependency has an install script without an allowScripts decision (or npm changed its wording). See ADR 0020."
            exit 1
          }
      - run: node --test .claude/hooks/
      - run: node --test scripts/
      # Nx regenerates the sprite before build and test, so drift would be hidden there.
      - name: Check the icon sprite and ICON_NAMES are up to date
        run: node scripts/build-icon-sprite.mjs --check
      - run: npx nx affected -t lint typecheck test build --output-style=static
      # Applies every migration to the Postgres service and fails when the result differs from
      # schema.prisma (a schema change without a migration). Only when `api` is affected.
      - name: Check migrations against Postgres
        run: |
          projects="$(npx nx show projects --affected --with-target db-check --json)"
          echo "Affected projects with a migration check: ${projects}"
          if node -e 'process.exit(JSON.parse(process.argv[1]).length > 0 ? 0 : 1)' "$projects"; then
            node apps/api/scripts/db-check.mjs
          fi
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Guards the production bundle (no e2e-only route, nonce placeholder present, ADR 0022).
      # Only runs when `web` is affected; the build it depends on is cached by the step above.
      - run: npx nx affected -t middleware-shell --output-style=static
      # The production bundle must not contain the dev/e2e-only mock auth API.
      - run: npx nx affected -t check-bundle --output-style=static
      # Storybook must build whenever `ui` (or something it depends on) is affected (ADR 0023).
      # Its accessibility run needs a browser and lives in the `e2e` job.
      - name: Build Storybook
        run: npx nx affected -t build-storybook --output-style=static

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-e2e-${{ runner.os }}-
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      # The job always runs (required check), but the browser is only downloaded when a browser
      # test target is affected: `e2e` (web-e2e) or `test-storybook` (libs/ui axe over Storybook).
      - name: Detect affected browser tests
        id: browser
        run: |
          projects="$(npx nx show projects --affected --with-target e2e,test-storybook --json)"
          echo "Affected projects with browser tests: ${projects}"
          if [ "$projects" = "[]" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run e2e and Storybook a11y tests
        if: steps.browser.outputs.needed == 'true'
        # One target at a time: web-e2e and test-storybook each use 4 browser workers.
        run: npx nx affected -t e2e test-storybook --parallel=1 --output-style=static
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            dist/.playwright/apps/web-e2e/playwright-report
            dist/.playwright/apps/web-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7

  # Not a required check (ADR 0018): reports Lighthouse scores, does not gate merges yet.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      # Scores only move when the web app changes: PRs that leave `web` untouched skip the audit.
      # Pushes to main and stage always run it, so both keep a baseline report.
      - name: Detect affected web app
        id: web
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          projects="$(npx nx show projects --affected --projects web --json)"
          echo "Affected: ${projects}"
          if [ "$projects" = "[]" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install Chromium
        if: steps.web.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium
      # @lhci/cli lives in its own lockfile (tools/lighthouse, ADR 0028): its dependency tree has
      # high npm audit advisories that must not reach the root tree or the required npm-audit job.
      - name: Install Lighthouse CI (install scripts off)
        if: steps.web.outputs.needed == 'true'
        run: npm ci --ignore-scripts --prefix tools/lighthouse
      # Advisories stay visible without failing the job.
      - name: Audit Lighthouse CI dependencies
        if: steps.web.outputs.needed == 'true'
        continue-on-error: true
        run: npm audit --prefix tools/lighthouse --audit-level=high
      - name: Lighthouse CI
        if: steps.web.outputs.needed == 'true'
        run: npx nx run web-e2e:lighthouse --output-style=static
      - if: always() && steps.web.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: dist/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Version and SHA-256 are pinned together (from the release asset digest);
      # Dependabot does not bump them, so update both by hand.
      - name: Install gitleaks
        run: |
          curl -fsSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner
