name: CI

# `stage` is the integration branch of the current stage (PROJECT.md 9.3): feature PRs target it,
# and `main` only gets release PRs from `stage` and hotfixes.
on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]

# Deny by default; each job grants only what it needs.
permissions: {}

env:
  SCARF_ANALYTICS: 'false'
  NX_NO_CLOUD: 'true'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test-build:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # Real Postgres for the migration check only (ADR 0025); unit tests use in-memory PGlite.
    # Trust auth: the container is reachable from this job only and holds no data.
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-lint-${{ runner.os }}-
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - run: npm run format:check
      - run: npm run lint:styles
      # ADR 0020: every dependency install script needs an explicit allowScripts decision.
      # `npm install-scripts ls` exits 0 either way, so check its output.
      - name: Check npm install scripts are reviewed
        run: |
          out="$(npm install-scripts ls)"
          echo "$out"
          grep -q 'No packages with unreviewed install scripts' <<<"$out" || {
            echo "::error::A dependency has an install script without an allowScripts decision (or npm changed its wording). See ADR 0020."
            exit 1
          }
      - run: node --test .claude/hooks/
      - run: node --test scripts/
      # Nx regenerates the sprite before build and test, so drift would be hidden there.
      - name: Check the icon sprite and ICON_NAMES are up to date
        run: node scripts/build-icon-sprite.mjs --check
      - run: npx nx affected -t lint typecheck test build --output-style=static
      # Applies every migration to the Postgres service and fails when the result differs from
      # schema.prisma (a schema change without a migration). Only when `api` is affected.
      - name: Check migrations against Postgres
        run: |
          projects="$(npx nx show projects --affected --with-target db-check --json)"
          echo "Affected projects with a migration check: ${projects}"
          if node -e 'process.exit(JSON.parse(process.argv[1]).length > 0 ? 0 : 1)' "$projects"; then
            node apps/api/scripts/db-check.mjs
          fi
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Guards the production bundle (no e2e-only route, nonce placeholder present, ADR 0022).
      # Only runs when `web` is affected; the build it depends on is cached by the step above.
      - run: npx nx affected -t middleware-shell --output-style=static
      # The production bundle must not contain the dev/e2e-only mock auth API.
      - run: npx nx affected -t check-bundle --output-style=static
      # Storybook must build whenever `ui` (or something it depends on) is affected (ADR 0023).
      # Its accessibility run needs a browser and lives in the `e2e` job.
      - name: Build Storybook
        run: npx nx affected -t build-storybook --output-style=static

  # Browser tests, sharded (#313): four web-e2e shards and Storybook axe run side by side, so the
  # full run (pushes to `stage`, release PRs into `main`) stays well under the job limit. A PR into
  # `stage` runs the diff-based set, sharded the same way (a Playwright config change runs every
  # spec, so it must not land on one runner).
  e2e-shard:
    name: e2e ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'web 1/4', kind: web, shard: 1 }
          - { name: 'web 2/4', kind: web, shard: 2 }
          - { name: 'web 3/4', kind: web, shard: 3 }
          - { name: 'web 4/4', kind: web, shard: 4 }
          - { name: 'storybook', kind: storybook, shard: 0 }
    env:
      PR_INTO_STAGE: ${{ github.event_name == 'pull_request' && github.base_ref == 'stage' }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ matrix.kind }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-e2e-${{ matrix.kind }}-${{ runner.os }}-
            nx-e2e-${{ runner.os }}-
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      # The browser is only downloaded when this entry has something to run: the diff-based PR
      # run (first entry only), or the affected `e2e` (web-e2e) / `test-storybook` (libs/ui axe).
      - name: Detect what this entry runs
        id: browser
        run: |
          if [ "${{ matrix.kind }}" = "web" ]; then
            target="e2e"
          else
            target="test-storybook"
          fi
          projects="$(npx nx show projects --affected --with-target "$target" --json)"
          echo "Affected projects with ${target}: ${projects}"
          if [ "$projects" = "[]" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true'
        # The system packages come from the Ubuntu mirrors; when those are down, the runner image
        # already has Chromium's libraries, so the browser alone is enough (no screenshot tests
        # depend on system fonts).
        run: |
          timeout 600 npx playwright install --with-deps chromium || {
            echo "::warning::System packages for Chromium failed to install (Ubuntu mirror?); installing the browser only"
            npx playwright install chromium
          }
      # A PR into `stage` runs only the browser tests its diff touches plus a smoke set
      # (tools/ci/pr-browser-tests.sh), so the required check stays short; the web part is split
      # into the same four shards, the Storybook part runs in its own entry. Pushes to `stage` and
      # release PRs into `main` run every affected suite, so nothing skipped on a PR goes unchecked.
      - name: Run the web-e2e tests for the diff, shard ${{ matrix.shard }}/${{ env.SHARDS }}
        if: steps.browser.outputs.needed == 'true' && env.PR_INTO_STAGE == 'true' && matrix.kind == 'web'
        env:
          PR_SHARD: ${{ matrix.shard }}
          PR_SHARDS: ${{ env.SHARDS }}
        run: tools/ci/pr-browser-tests.sh origin/stage web
      - name: Run the Storybook a11y tests for the diff
        if: steps.browser.outputs.needed == 'true' && env.PR_INTO_STAGE == 'true' && matrix.kind == 'storybook'
        run: tools/ci/pr-browser-tests.sh origin/stage ui
      # One shard of every web-e2e spec (desktop and phone); each shard writes a blob report that
      # the `e2e` job merges into one HTML report when something failed.
      - name: Run web-e2e shard ${{ matrix.shard }}/${{ env.SHARDS }}
        if: steps.browser.outputs.needed == 'true' && env.PR_INTO_STAGE != 'true' && matrix.kind == 'web'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/blob-report
        run: npx nx affected -t e2e --output-style=static -- --shard=${{ matrix.shard }}/${{ env.SHARDS }} --reporter=blob,line
      - name: Run Storybook a11y tests
        if: steps.browser.outputs.needed == 'true' && env.PR_INTO_STAGE != 'true' && matrix.kind == 'storybook'
        run: npx nx affected -t test-storybook --output-style=static
      - name: Upload the blob report of this shard
        if: always() && matrix.kind == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output-${{ matrix.kind }}-${{ matrix.shard }}
          path: |
            dist/.playwright/apps/web-e2e/playwright-report
            dist/.playwright/apps/web-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7

  # The required check (branch protection asks for `e2e`): green when every shard passed or had
  # nothing to run, red when one failed or was cancelled. On a failure it merges the shards' blob
  # reports into one Playwright HTML report artifact.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-shard
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.e2e-shard.result == 'failure'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.e2e-shard.result == 'failure'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.e2e-shard.result == 'failure'
        run: npm ci
      - name: Download the blob reports
        if: needs.e2e-shard.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        if: needs.e2e-shard.result == 'failure'
        run: |
          if [ -d all-blob-reports ] && [ -n "$(ls -A all-blob-reports)" ]; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "::notice::No blob reports to merge (the failure was before or outside web-e2e)"
          fi
      - if: needs.e2e-shard.result == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Result of the shards
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}"
          case "${{ needs.e2e-shard.result }}" in
            success|skipped) exit 0 ;;
            *) echo "::error::A browser test shard ${{ needs.e2e-shard.result }}"; exit 1 ;;
          esac

  # Not a required check (ADR 0018): reports Lighthouse scores, does not gate merges yet.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          # Affected base: the PR's target branch, or the pushed branch itself.
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      # Scores only move when the web app changes: PRs that leave `web` untouched skip the audit.
      # Pushes to main and stage always run it, so both keep a baseline report.
      - name: Detect affected web app
        id: web
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          projects="$(npx nx show projects --affected --projects web --json)"
          echo "Affected: ${projects}"
          if [ "$projects" = "[]" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install Chromium
        if: steps.web.outputs.needed == 'true'
        # The system packages come from the Ubuntu mirrors; when those are down, the runner image
        # already has Chromium's libraries, so the browser alone is enough (no screenshot tests
        # depend on system fonts).
        run: |
          timeout 600 npx playwright install --with-deps chromium || {
            echo "::warning::System packages for Chromium failed to install (Ubuntu mirror?); installing the browser only"
            npx playwright install chromium
          }
      # @lhci/cli lives in its own lockfile (tools/lighthouse, ADR 0028): its dependency tree has
      # high npm audit advisories that must not reach the root tree or the required npm-audit job.
      - name: Install Lighthouse CI (install scripts off)
        if: steps.web.outputs.needed == 'true'
        run: npm ci --ignore-scripts --prefix tools/lighthouse
      # Advisories stay visible without failing the job.
      - name: Audit Lighthouse CI dependencies
        if: steps.web.outputs.needed == 'true'
        continue-on-error: true
        run: npm audit --prefix tools/lighthouse --audit-level=high
      - name: Lighthouse CI
        if: steps.web.outputs.needed == 'true'
        run: npx nx run web-e2e:lighthouse --output-style=static
      - if: always() && steps.web.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: dist/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Version and SHA-256 are pinned together (from the release asset digest);
      # Dependabot does not bump them, so update both by hand.
      - name: Install gitleaks
        run: |
          curl -fsSL -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner
