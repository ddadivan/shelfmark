<title>Shelfmark Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: inset sidebar (L1) + fluid feed on the L0 canvas; below 64em the sidebar becomes a bottom tab bar.
   Rules: VectorLab visual-taste skills.
   Type: body 16 / secondary 14 / meta 12 (meta only for domains, dates, counts, kbd); headings on Major Second (1.125).
   Weights 400 / 500 / 600. Line-height: body 1.5, headings 1.2-1.25, meta 1.4.
   Space: 8pt for components, 4pt for micro gaps. Radii on the same grid, concentric (outer = inner + padding).
   Elevation: 1px subtle border first, soft shadow < 0.08 in light, inset top highlight in dark; no glass. */
:root{
  --l0:#F4F4F1;--l1:#FFFFFF;--hover:#EEEEEA;--pressed:#E6E6E1;
  --fg:#18181A;--muted:#5E5E63;
  --line:rgba(24,24,26,.08);--line-strong:rgba(24,24,26,.14);--control:#85858A;
  --primary:#18181A;--on-primary:#FFFFFF;
  --accent:#4F7A4B;--accent-bg:#E3EEDF;--accent-text:#2F4A2C;--focus:#4F7A4B;--ai:#4C54B5;--mark:#8DBB86;
  --shadow-l1:0 1px 2px rgba(24,24,26,.04);--shadow-l2:0 4px 12px rgba(24,24,26,.06);--highlight:none;
  --cover-ink:rgba(0,0,0,.72);--cover-on:#FFFFFF;--cover-btn:rgba(255,255,255,.94);--cover-btn-ink:#18181A;
  --fc-graphite:#3A3A3F;--fb-graphite:#ECECEA;--fc-sage:#3F6B3B;--fb-sage:#E3EEDF;--fc-ocean:#24577F;--fb-ocean:#DDEAF4;
  --fc-rose:#96304F;--fb-rose:#F7E0E7;--fc-amber:#7A5605;--fb-amber:#F6EBCF;--fc-plum:#6A3D7A;--fb-plum:#EFE3F3;--fc-clay:#8F4423;--fb-clay:#F6E4DA;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-full:999px;
  --t-meta:.75rem;--t-sec:.875rem;--t-body:1rem;--t-h4:1.125rem;--t-h3:1.27rem;--t-h1:1.6rem;
  --lh-meta:1.4;--lh-sec:1.5;--lh-body:1.5;--lh-head:1.25;--lh-h1:1.2;
  --font-sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --l0:#111113;--l1:#1A1A1D;--hover:#242428;--pressed:#2C2C31;
  --fg:#EDEDEF;--muted:#A0A0A6;
  --line:rgba(237,237,239,.12);--line-strong:rgba(237,237,239,.2);--control:#6C6C73;
  --primary:#EDEDEF;--on-primary:#131315;
  --accent:#8DBB86;--accent-bg:#21301E;--accent-text:#C6DEC0;--focus:#8DBB86;--ai:#A9AEF2;--mark:#4F7A4B;
  --shadow-l1:none;--shadow-l2:0 4px 12px rgba(0,0,0,.3);--highlight:inset 0 1px 0 rgba(255,255,255,.05);
  --fc-graphite:#D4D4D8;--fb-graphite:#2A2A2E;--fc-sage:#A9CFA3;--fb-sage:#22301F;--fc-ocean:#9CC4E6;--fb-ocean:#1B2B3A;
  --fc-rose:#EDA6BC;--fb-rose:#3A1E27;--fc-amber:#E6C27A;--fb-amber:#332A12;--fc-plum:#D2B2DE;--fb-plum:#2E2135;--fc-clay:#EDB49A;--fb-clay:#3A231A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --l0:#111113;--l1:#1A1A1D;--hover:#242428;--pressed:#2C2C31;
  --fg:#EDEDEF;--muted:#A0A0A6;
  --line:rgba(237,237,239,.12);--line-strong:rgba(237,237,239,.2);--control:#6C6C73;
  --primary:#EDEDEF;--on-primary:#131315;
  --accent:#8DBB86;--accent-bg:#21301E;--accent-text:#C6DEC0;--focus:#8DBB86;--ai:#A9AEF2;--mark:#4F7A4B;
  --shadow-l1:none;--shadow-l2:0 4px 12px rgba(0,0,0,.3);--highlight:inset 0 1px 0 rgba(255,255,255,.05);
  --fc-graphite:#D4D4D8;--fb-graphite:#2A2A2E;--fc-sage:#A9CFA3;--fb-sage:#22301F;--fc-ocean:#9CC4E6;--fb-ocean:#1B2B3A;
  --fc-rose:#EDA6BC;--fb-rose:#3A1E27;--fc-amber:#E6C27A;--fb-amber:#332A12;--fc-plum:#D2B2DE;--fb-plum:#2E2135;--fc-clay:#EDB49A;--fb-clay:#3A231A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--l0);color:var(--fg);font-family:var(--font-sans);font-size:var(--t-body);line-height:var(--lh-body);font-weight:400;-webkit-font-smoothing:antialiased}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* L1 surface: border first, then a soft shadow (light) or a top highlight (dark) */
.l1{background:var(--l1);border:1px solid var(--line);box-shadow:var(--shadow-l1),var(--highlight)}

/* Shell */
.app{display:flex;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4);gap:var(--s6)}
.side{flex:none;width:264px;position:sticky;top:var(--s4);align-self:flex-start;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:var(--s4) var(--s2);border-radius:var(--r-xl);overflow:auto}
.main{flex:1;min-width:0;padding-bottom:var(--s8)}
.logo{display:flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s2);margin-bottom:var(--s2);font-size:var(--t-h4);line-height:var(--lh-head);font-weight:600}
.nav{display:flex;align-items:center;gap:var(--s3);height:32px;padding:0 var(--s2);border-radius:var(--r-sm);text-decoration:none;font-size:var(--t-sec);line-height:var(--lh-sec);font-weight:500;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav svg{flex:none;color:var(--muted)}
.nav .n{margin-left:auto;font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.nav[aria-current]{background:var(--accent-bg);color:var(--accent-text)}
.nav[aria-current] svg,.nav[aria-current] .n{color:var(--accent-text)}
.nav.plain{font-weight:400}
.sec{display:flex;align-items:center;gap:var(--s1);height:32px;padding:0 var(--s2);margin-top:var(--s4);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500;color:var(--muted)}
.sec .add{margin-left:auto}
.tile{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-sm)}
.fav{flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:var(--r-xs);background:var(--hover);color:var(--muted);font-size:var(--t-meta);line-height:1;font-weight:500}
.side-foot{margin-top:auto;padding-top:var(--s2);border-top:1px solid var(--line)}

/* Top bar */
.top{display:flex;align-items:center;gap:var(--s3);height:40px}
.search{flex:1 1 auto;max-width:560px;display:flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s1) 0 var(--s3);border-radius:var(--r-full);color:var(--muted)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:var(--t-sec);line-height:var(--lh-sec)}
.search input::placeholder{color:var(--muted)}
.kbd{display:inline-grid;place-items:center;height:24px;padding:0 var(--s2);border:1px solid var(--line);border-radius:var(--r-xs);font-family:var(--font-mono);font-size:var(--t-meta);line-height:var(--lh-meta);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s4);border:0;border-radius:var(--r-full);background:transparent;font-size:var(--t-sec);line-height:var(--lh-sec);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--on-primary);padding-left:var(--s3)}
.btn.primary:hover{opacity:.9}
.btn.sm{height:32px;padding:0 var(--s3)}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--r-full);background:transparent;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--fg)}
.right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);position:relative}
.avatar{width:40px;height:40px;border:0;border-radius:var(--r-full);background:var(--hover);font-size:var(--t-sec);line-height:1;font-weight:600}
.menu{position:absolute;right:0;top:48px;z-index:100;min-width:240px;padding:var(--s2);border-radius:var(--r-lg);background:var(--l1);border:1px solid var(--line-strong);box-shadow:var(--shadow-l2),var(--highlight)}
.mi{display:flex;align-items:center;gap:var(--s3);width:100%;height:40px;padding:0 var(--s2);border:0;border-radius:var(--r-sm);background:transparent;font-size:var(--t-sec);line-height:var(--lh-sec);font-weight:500;text-align:left}
.mi:hover{background:var(--hover)}
.mi[aria-checked="true"]{color:var(--accent-text);background:var(--accent-bg)}
.mi .kbd{margin-left:auto}
.mh{padding:var(--s2) var(--s2) var(--s1);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500;color:var(--muted)}
.msep{height:1px;margin:var(--s2) 0;background:var(--line)}

/* Page header */
.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s8)}
.head h1{margin:0;font-size:var(--t-h1);line-height:var(--lh-h1);font-weight:600;text-wrap:balance}
.head .count{font-size:var(--t-sec);line-height:var(--lh-sec);color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:var(--s2);align-self:center}
.seg{display:inline-flex;padding:var(--s1);border-radius:var(--r-full);background:var(--hover)}
.seg button{display:inline-grid;place-items:center;width:32px;height:24px;border:0;border-radius:var(--r-full);background:transparent;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--l1);color:var(--fg);box-shadow:0 0 0 1px var(--line),var(--shadow-l1)}
.views{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.chip{display:inline-flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-full);background:var(--l1);font-size:var(--t-sec);line-height:var(--lh-sec);font-weight:500}
.chip:hover{border-color:var(--line-strong)}
.chip b{font-weight:400;font-size:var(--t-meta);line-height:var(--lh-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent-text)}
.chip[aria-pressed="true"] b{color:var(--accent-text)}
.chip.dash{border-style:dashed;border-color:var(--control);background:transparent;color:var(--muted)}

/* Feed */
.feed{margin-top:var(--s6)}
.masonry{column-width:256px;column-gap:var(--s4)}
.masonry .card{break-inside:avoid;margin-bottom:var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:var(--s4)}
.card{position:relative;display:block;border-radius:var(--r-lg);overflow:hidden;text-decoration:none;transition:border-color 120ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.cover{position:relative;overflow:hidden;margin:var(--s2) var(--s2) 0;border-radius:var(--r-sm);max-width:100%}
.cover-in{position:absolute;inset:0;transition:transform 320ms var(--ease-out)}
.cover-in svg{width:100%;height:100%}
.openbar{position:absolute;left:var(--s2);right:var(--s2);bottom:var(--s2);display:flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border-radius:var(--r-full);background:var(--l1);border:1px solid var(--line-strong);font-size:var(--t-meta);line-height:var(--lh-meta);opacity:0;transform:translateY(8px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.openbar span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.openbar span:last-child{font-weight:500}
.acts{position:absolute;top:var(--s2);right:var(--s2);display:flex;gap:var(--s1);opacity:0;transition:opacity 200ms var(--ease-out)}
.act{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line-strong);border-radius:var(--r-full);background:var(--l1);color:var(--fg)}
@media (hover:hover){
  .card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-l2),var(--highlight)}
  .card:hover .cover-in{transform:scale(1.04)}
  .card:hover .openbar{opacity:1;transform:none}
  .card:hover .acts{opacity:1}
}
.card:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.body{padding:var(--s3) var(--s4) var(--s4)}
.title{margin:0;font-size:var(--t-body);line-height:var(--lh-body);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum,.note{margin:var(--s1) 0 0;font-size:var(--t-sec);line-height:var(--lh-sec);color:var(--muted)}
.sum{display:flex;gap:var(--s2)}
.sum span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-style:italic}
.meta{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:var(--t-meta);line-height:var(--lh-meta);color:var(--muted)}
.meta .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .star{margin-left:auto;flex:none;color:var(--accent)}
/* Cover stand-ins: in the product this is the page's own preview image. */
.tc{position:absolute;inset:0;padding:var(--s4);display:flex;flex-direction:column;justify-content:space-between}
.tc small{font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500;opacity:.8}
.tc strong{font-size:var(--t-h3);line-height:var(--lh-head);font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:var(--r-full);background:var(--cover-btn);color:var(--cover-btn-ink);display:grid;place-items:center}
.dur{position:absolute;left:var(--s2);top:var(--s2);padding:0 var(--s1);border-radius:var(--r-xs);background:var(--cover-ink);color:var(--cover-on);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500}
.none{position:absolute;inset:0;display:grid;place-items:center;background:var(--hover)}
.none span{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--r-md);background:var(--l1);border:1px solid var(--line);color:var(--muted);font-size:var(--t-h3);line-height:1;font-weight:600}

/* List and Headlines: one L1 panel with hairline row dividers */
.panel{border-radius:var(--r-lg);overflow:hidden}
.panel>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s4);text-decoration:none}
.row:hover,.hl:hover{background:var(--hover)}
.thumb{position:relative;flex:none;width:72px;height:48px;border-radius:var(--r-sm);overflow:hidden}
.thumb svg{width:100%;height:100%}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.row .tt{font-size:var(--t-body);line-height:var(--lh-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:var(--s1)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 var(--s2);border-radius:var(--r-full);border:1px solid var(--line);color:var(--muted);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500}
.fold{display:flex;align-items:center;gap:var(--s2);width:128px;font-size:var(--t-sec);line-height:var(--lh-sec);color:var(--muted)}
.fold i{width:12px;height:12px;border-radius:var(--r-xs)}
.date{width:64px;text-align:right;font-size:var(--t-meta);line-height:var(--lh-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.hl{display:grid;grid-template-columns:16px minmax(0,1fr) 184px 128px 64px;align-items:center;gap:var(--s3);height:40px;padding:0 var(--s4);text-decoration:none}
.hl .t{font-size:var(--t-sec);line-height:var(--lh-sec);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .m{font-size:var(--t-meta);line-height:var(--lh-meta);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Phone tab bar: an opaque L2 bar, no blur */
.tabbar{display:none}

@media (max-width:63.99em){
  .side{display:none}
  .app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  .ask-btn,.kbd-hint,.split{display:none}
  .tabbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 var(--s2);border-radius:var(--r-xl);background:var(--l1);border:1px solid var(--line-strong);box-shadow:var(--shadow-l2),var(--highlight)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);width:56px;height:56px;border-radius:var(--r-lg);font-size:var(--t-meta);line-height:var(--lh-meta);font-weight:500;color:var(--muted);text-decoration:none}
  .tab[aria-current]{background:var(--hover);color:var(--fg)}
  .fab{width:56px;height:56px;border:0;border-radius:var(--r-lg);background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
  .row .tags,.row .fold{display:none}
  .hl{grid-template-columns:16px minmax(0,1fr) 64px;height:48px}
  .hl .m.dom,.hl .m.fo{display:none}
}
@media (max-width:39.99em){
  .top .add-btn,.avatar-wrap{display:none}
  .search{max-width:none;height:48px}
  .head{margin-top:var(--s6)}
  .masonry{column-count:2;column-width:auto;column-gap:var(--s2)}
  .masonry .card{margin-bottom:var(--s2)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  .card{border-radius:var(--r-md)}
  .cover{margin:var(--s1) var(--s1) 0;border-radius:var(--r-sm)}
  .body{padding:var(--s2) var(--s3) var(--s3)}
  .title{font-size:var(--t-sec);line-height:var(--lh-sec)}
  .tc{padding:var(--s3)}
  .tc strong{font-size:var(--t-body);line-height:var(--lh-head);-webkit-line-clamp:2}
  .sum,.note{display:none}
  .chip{height:40px}
  .views{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .views .chip{flex:none}
  .tools .sort{display:none}
}
@media (prefers-reduced-motion:reduce){.card,.cover-in,.openbar,.acts{transition:none}.card:hover .cover-in{transform:none}}
</style>

  function card(l, grid) {
    return `<a class="card l1" href="#" title="${esc(l.title)}, saved ${esc(l.date)}">${cover(l, grid ? '16 / 9' : l.ratio)}
      <div class="body"><h2 class="title">${esc(l.title)}</h2>
      ${l.summary ? `<p class="sum"><svg width="12" height="12" style="flex:none;margin-top:2px;color:var(--ai)" role="img" aria-label="Summary written by AI, may be inaccurate"><use href="#i-spark"/></svg><span>${esc(l.summary)}</span></p>` : ''}
      ${l.note ? `<p class="note">${esc(l.note)}</p>` : ''}
      <div class="meta"><span class="fav">${letter(l)}</span><span class="d">${esc(l.domain)}</span>${l.fav ? `<svg class="star" width="16" height="16" role="img" aria-label="Favorite"><use href="#i-star-fill"/></svg>` : ''}</div></div></a>`;
  }

  function thumb(l) {
    if (l.kind === 'type') return `<span class="thumb" style="background:${l.bg}"></span>`;
    if (l.kind === 'none') return `<span class="thumb"><span class="none"><span style="width:24px;height:24px;font-size:12px;line-height:1;border-radius:8px">${letter(l)}</span></span></span>`;
    const play = l.kind === 'video' ? `<span class="play" style="width:24px;height:24px;margin:-12px 0 0 -12px">${icon('i-play', 12)}</span>` : '';
    return `<span class="thumb">${art(l)}${play}</span>`;
  }

  function row(l) {
    return `<a class="row" href="#">${thumb(l)}<span class="tx"><span class="tt">${esc(l.title)}</span><span class="meta" style="margin:0"><span class="fav">${letter(l)}</span><span class="d">${esc(l.domain)}</span></span></span>
      <span class="tags">${l.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</span>
      <span class="fold"><i style="background:var(--fb-${l.c})"></i>${esc(l.folder)}</span><span class="date">${esc(l.date)}</span></a>`;
  }

  function headline(l) {
    return `<a class="hl" href="#"><span class="fav">${letter(l)}</span><span class="t">${esc(l.title)}</span><span class="m dom">${esc(l.domain)}</span><span class="m fo" style="display:flex;align-items:center;gap:8px"><i style="width:12px;height:12px;border-radius:4px;background:var(--fb-${l.c})"></i>${esc(l.folder)}</span><span class="m" style="text-align:right">${esc(l.date)}</span></a>`;
  }

  function visible() {
    const q = state.q.trim().toLowerCase();
    return LINKS.filter((l) => (state.chip === 'all' || l.type === state.chip) && (!q || (l.title + ' ' + l.domain + ' ' + l.tags.join(' ')).toLowerCase().includes(q)));
  }

  function render() {
    const items = visible();
    const feed = document.getElementById('feed');
    if (!items.length) {
      feed.innerHTML = `<p class="muted" style="padding:32px 0">Nothing found. Try another word or clear the search.</p>`;
    } else if (state.view === 'masonry' || state.view === 'grid') {
      const grid = state.view === 'grid';
      feed.innerHTML = `<div class="${grid ? 'grid' : 'masonry'}">${items.map((l) => card(l, grid)).join('')}</div>`;
    } else if (state.view === 'list') {
      feed.innerHTML = `<div class="panel l1">${items.map(row).join('')}</div>`;
    } else {
      feed.innerHTML = `<div class="panel l1">${items.map(headline).join('')}</div>`;
    }
    document.getElementById('seg').innerHTML = VIEWS.map(([id, label, ic]) => `<button type="button" role="radio" aria-checked="${state.view === id}" aria-label="${label}" title="${label}" data-view="${id}">${icon(ic, 16)}</button>`).join('');
    document.getElementById('chips').innerHTML = CHIPS.map(([id, label, n]) => `<button type="button" class="chip" aria-pressed="${state.chip === id}" data-chip="${id}">${label} <b>${n}</b></button>`).join('')
      + `<button type="button" class="chip dash">${icon('i-plus', 16)}Save this view</button>`;
    const total = state.chip === 'all' && !state.q ? 58 : items.length;
    document.getElementById('count').textContent = total === 1 ? '1 link' : total + ' links';
  }

  document.getElementById('folders').innerHTML = FOLDERS.map(([n, c, col]) => `<a class="nav plain" href="#"><span class="tile" style="background:var(--fb-${col});color:var(--fc-${col})">${icon('i-folder', 16)}</span>${n}<span class="n">${c}</span></a>`).join('');
  document.getElementById('tags').innerHTML = TAGS.map(([n, c]) => `<a class="nav plain" href="#">${icon('i-hash', 20)}${n}<span class="n">${c}</span></a>`).join('');

  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-view]');
    if (v) { state.view = v.dataset.view; try { localStorage.setItem('sm-proto-view', state.view); } catch (err) {} render(); return; }
    const c = e.target.closest('[data-chip]');
    if (c) { state.chip = c.dataset.chip; render(); return; }
    const a = e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });

  document.getElementById('seg').addEventListener('keydown', (e) => {
    const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    const i = VIEWS.findIndex((x) => x[0] === state.view);
    state.view = VIEWS[(i + keys[e.key] + VIEWS.length) % VIEWS.length][0];
    render();
    document.querySelector(`[data-view="${state.view}"]`).focus();
  });

  const q = document.getElementById('q');
  q.addEventListener('input', () => { state.q = q.value; render(); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') closeMenu();
  });

  // Account menu: theme and keyboard shortcuts moved here from the top bar.
  const avatar = document.getElementById('avatar');
  const menu = document.getElementById('acct');
  function closeMenu() { if (!menu.hidden) { menu.hidden = true; avatar.setAttribute('aria-expanded', 'false'); } }
  function markTheme() {
    const t = document.documentElement.getAttribute('data-theme') || 'system';
    menu.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.themeSet === t)));
  }
  avatar.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
    avatar.setAttribute('aria-expanded', String(!menu.hidden));
    if (!menu.hidden) { markTheme(); menu.querySelector('.mi').focus(); }
  });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-theme-set]');
    if (b) {
      const t = b.dataset.themeSet;
      if (t === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
      markTheme();
    }
    closeMenu();
    avatar.focus();
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.avatar-wrap')) closeMenu(); });

  render();
})();
</script>
