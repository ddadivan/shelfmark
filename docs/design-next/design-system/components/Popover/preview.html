<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Popover</title></head><body>
<div class="sm-root"><div class="sm-pop sm-l2" role="dialog" aria-label="Filter">
<div class="sm-pgroup"><span class="lbl">Type</span><div style="display:flex;flex-wrap:wrap;gap:4px"><button class="sm-chip" aria-pressed="true">Videos</button><button class="sm-chip" aria-pressed="false">Articles</button><button class="sm-chip" aria-pressed="false">Clothes</button></div></div>
<div class="sm-pgroup"><span class="lbl">Saved</span><div class="sm-seg" role="radiogroup" aria-label="Saved"><button role="radio" aria-checked="true">Any time</button><button role="radio" aria-checked="false">Week</button><button role="radio" aria-checked="false">Month</button></div></div>
<div class="sm-pgroup" style="flex-direction:row;justify-content:space-between;align-items:center"><span style="font-size:.875rem">Only favorites</span><button class="sm-switch" role="switch" aria-checked="false" aria-label="Only favorites"></button></div>
</div></div>
</body></html>
