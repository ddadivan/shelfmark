<title>Shelfmark Library Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono&display=swap">
<style>
/* Layout: desktop sidebar + feed; the Link page opens beside a compact list from 80em, over the feed below it.
   Foundations: Graphite palette; type 12 / 14 / 16 + Major Second headings; 8pt grid; radii 4 / 8 / 12 / 16, controls 8;
   elevation by border first, shadows under 8%, no glass. */
:root{
  --l0:#F5F5F4;--l1:#FFFFFF;--hover:#EFEFED;--pressed:#E6E6E3;--fg:#171717;--muted:#5D5D5A;--control:#878783;
  --line:rgba(20,20,22,.08);--line-strong:rgba(20,20,22,.14);
  --accent:#171717;--on-accent:#FFFFFF;--accent-bg:#EBEBE8;--accent-text:#171717;--focus:#2563EB;
  --ai:#4C54B5;--ai-bg:#ECEDF9;--danger:#C0352B;--warning:#8F5B00;--success:#2E7A3A;--star:#B26A00;
  --sh1:0 1px 2px rgba(20,20,22,.04);--sh2:0 4px 12px rgba(20,20,22,.06);--sh3:0 8px 24px rgba(20,20,22,.07);--hi:none;--scrim:rgba(20,20,22,.4);
  --sepia-bg:#F6EFE2;--sepia-fg:#3B3024;--sepia-muted:#6E5F4C;
  --fb-graphite:#ECECEA;--fc-graphite:#3A3A3F;--fb-ocean:#DDEAF4;--fc-ocean:#24577F;--fb-rose:#F7E0E7;--fc-rose:#96304F;--fb-amber:#F6EBCF;--fc-amber:#7A5605;
  --fb-plum:#EFE3F3;--fc-plum:#6A3D7A;--fb-teal:#DAEFEC;--fc-teal:#1F6460;--fb-clay:#F6E4DA;--fc-clay:#8F4423;--fb-sage:#E3EEDF;--fc-sage:#3F6B3B;
  --cover-btn:rgba(255,255,255,.94);--cover-ink:#18181A;--cover-chip:rgba(0,0,0,.72);--cover-on:#FFFFFF;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif;--readable:"Atkinson Hyperlegible","Onest",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --t-meta:.75rem;--t-sec:.875rem;--t-body:1rem;--t-s:1.13rem;--t-m:1.27rem;--t-l:1.42rem;--d-s:1.6rem;--d:2.03rem;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --l0:#0F0F0F;--l1:#181818;--hover:#222222;--pressed:#2B2B2B;--fg:#EDEDED;--muted:#A1A1A1;--control:#707070;
  --line:rgba(237,237,239,.12);--line-strong:rgba(237,237,239,.2);
  --accent:#EDEDED;--on-accent:#111111;--accent-bg:#2A2A2A;--accent-text:#EDEDED;--focus:#6EA8FE;
  --ai:#A9AEF2;--ai-bg:#22243D;--danger:#F87168;--warning:#E8B45A;--success:#7CC488;--star:#F0B44C;
  --sh1:none;--sh2:0 4px 12px rgba(0,0,0,.3);--sh3:0 8px 24px rgba(0,0,0,.4);--hi:inset 0 1px 0 rgba(255,255,255,.05);--scrim:rgba(0,0,0,.6);
  --sepia-bg:#2A241C;--sepia-fg:#EADFCB;--sepia-muted:#B8A88E;
  --fb-graphite:#2A2A2E;--fc-graphite:#D4D4D8;--fb-ocean:#1B2B3A;--fc-ocean:#9CC4E6;--fb-rose:#3A1E27;--fc-rose:#EDA6BC;--fb-amber:#332A12;--fc-amber:#E6C27A;
  --fb-plum:#2E2135;--fc-plum:#D2B2DE;--fb-teal:#16302E;--fc-teal:#93D3CC;--fb-clay:#3A231A;--fc-clay:#EDB49A;--fb-sage:#22301F;--fc-sage:#A9CFA3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --l0:#0F0F0F;--l1:#181818;--hover:#222222;--pressed:#2B2B2B;--fg:#EDEDED;--muted:#A1A1A1;--control:#707070;
  --line:rgba(237,237,239,.12);--line-strong:rgba(237,237,239,.2);
  --accent:#EDEDED;--on-accent:#111111;--accent-bg:#2A2A2A;--accent-text:#EDEDED;--focus:#6EA8FE;
  --ai:#A9AEF2;--ai-bg:#22243D;--danger:#F87168;--warning:#E8B45A;--success:#7CC488;--star:#F0B44C;
  --sh1:none;--sh2:0 4px 12px rgba(0,0,0,.3);--sh3:0 8px 24px rgba(0,0,0,.4);--hi:inset 0 1px 0 rgba(255,255,255,.05);--scrim:rgba(0,0,0,.6);
  --sepia-bg:#2A241C;--sepia-fg:#EADFCB;--sepia-muted:#B8A88E;
  --fb-graphite:#2A2A2E;--fc-graphite:#D4D4D8;--fb-ocean:#1B2B3A;--fc-ocean:#9CC4E6;--fb-rose:#3A1E27;--fc-rose:#EDA6BC;--fb-amber:#332A12;--fc-amber:#E6C27A;
  --fb-plum:#2E2135;--fc-plum:#D2B2DE;--fb-teal:#16302E;--fc-teal:#93D3CC;--fb-clay:#3A231A;--fc-clay:#EDB49A;--fb-sage:#22301F;--fc-sage:#A9CFA3;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--l0);color:var(--fg);font-family:var(--font);font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block;flex:none}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.l1{background:var(--l1);border:1px solid var(--line);box-shadow:var(--sh1),var(--hi)}
.l2{background:var(--l1);border:1px solid var(--line-strong);box-shadow:var(--sh2),var(--hi)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:var(--r-sm);background:transparent;font-size:var(--t-sec);line-height:1.5;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.sm{height:32px;padding:0 12px}
.btn.primary{background:var(--accent);color:var(--on-accent);padding-left:12px}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn.secondary{background:var(--l1);border:1px solid var(--line-strong)}
.btn.secondary:hover{background:var(--hover)}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib[aria-pressed="true"]{color:var(--fg);background:var(--accent-bg)}
.seg{display:inline-flex;padding:4px;border-radius:var(--r-md);background:var(--hover);gap:2px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:24px;padding:0 8px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:var(--t-sec);font-weight:500}
.seg button[aria-checked="true"]{background:var(--l1);color:var(--fg);box-shadow:0 0 0 1px var(--line),var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--l1);font-size:var(--t-sec);font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--line-strong)}
.chip b{font-weight:400;font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent-text)}
.chip.dash{border-style:dashed;border-color:var(--control);background:transparent;color:var(--muted)}
.kbd{display:inline-grid;place-items:center;height:24px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r-xs);font-family:var(--mono);font-size:var(--t-meta);color:var(--muted)}
.tile{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r-sm);flex:none}
.fav{display:grid;place-items:center;width:16px;height:16px;border-radius:var(--r-xs);background:var(--hover);color:var(--muted);font-size:var(--t-meta);font-weight:500;flex:none;line-height:1}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--muted);font-size:var(--t-meta);font-weight:500}

/* Shell */
.app{display:flex;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;gap:24px}
.side{flex:none;width:264px;position:sticky;top:16px;align-self:flex-start;height:calc(100vh - 32px);display:flex;flex-direction:column;padding:16px 8px;border-radius:var(--r-lg);overflow:auto}
.logo{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;margin-bottom:8px;font-size:var(--t-s);font-weight:600}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:32px;padding:0 8px;border:0;border-radius:var(--r-sm);background:transparent;text-decoration:none;text-align:left;font-size:var(--t-sec);font-weight:500;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav svg{color:var(--muted)}
.nav .n{margin-left:auto;font-size:var(--t-meta);font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.nav[aria-current="page"]{background:var(--accent-bg);color:var(--accent-text)}
.nav[aria-current="page"] svg{color:var(--accent-text)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);background:var(--accent);color:var(--on-accent);font-size:var(--t-meta);font-weight:500;display:grid;place-items:center}
.nav.plain{font-weight:400}
.sec{display:flex;align-items:center;gap:4px;height:32px;padding:0 8px;margin-top:16px;font-size:var(--t-meta);font-weight:500;color:var(--muted)}
.sec .ib{margin-left:auto;width:24px;height:24px}
.side-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:40px}
.search{flex:1 1 auto;max-width:560px;display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:var(--r-sm);color:var(--muted)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font-size:var(--t-sec)}
.search input::placeholder{color:var(--muted)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border:0;border-radius:var(--r-full);background:var(--hover);font-size:var(--t-sec);font-weight:600}

/* Library page */
.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;margin-top:32px}
.head h1{margin:0;font-size:var(--d-s);line-height:1.2;font-weight:600;text-wrap:balance}
.head .count{font-size:var(--t-sec);color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;align-self:center}
.views{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.feed{margin-top:24px;padding-bottom:32px}
.masonry{column-width:256px;column-gap:16px}
.masonry .card{break-inside:avoid;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px}
.card{position:relative;display:block;border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:border-color 120ms var(--ease),box-shadow 200ms var(--ease)}
.card .open{position:absolute;inset:0;z-index:1;border:0;background:transparent;border-radius:inherit}
.cover{position:relative;overflow:hidden;margin:4px 4px 0;border-radius:var(--r-sm)}
.cover-in{position:absolute;inset:0;transition:transform 320ms var(--ease)}
.cover-in svg,.thumb svg{width:100%;height:100%}
.acts{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:4px;opacity:0;transition:opacity 120ms var(--ease)}
.act{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--l1);color:var(--fg)}
.act[aria-pressed="true"]{color:var(--star)}
@media (hover:hover){.card:hover{border-color:var(--line-strong);box-shadow:var(--sh2),var(--hi)}.card:hover .cover-in{transform:scale(1.04)}.card:hover .acts{opacity:1}}
.card:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.body{padding:12px 16px 16px}
.title{margin:0;font-size:var(--t-body);line-height:1.5;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum{display:flex;gap:8px;margin:4px 0 0;font-size:var(--t-sec);color:var(--muted)}
.sum span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--t-meta);color:var(--muted)}
.meta .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .end{margin-left:auto;display:flex;align-items:center;gap:6px}
.star{color:var(--star)}
.pin{color:var(--muted)}
.tc{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.tc small{font-size:var(--t-meta);font-weight:600;opacity:.8}
.tc strong{font-size:var(--t-m);line-height:1.25;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:var(--r-full);background:var(--cover-btn);color:var(--cover-ink);display:grid;place-items:center}
.dur{position:absolute;left:8px;top:8px;padding:0 6px;border-radius:var(--r-xs);background:var(--cover-chip);color:var(--cover-on);font-size:var(--t-meta);font-weight:500;line-height:20px}
.none{position:absolute;inset:0;display:grid;place-items:center;background:var(--hover)}
.none span{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--r-md);background:var(--l1);border:1px solid var(--line);color:var(--muted);font-size:var(--t-m);font-weight:600}
.panel{border-radius:var(--r-lg);overflow:hidden}
.panel>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:8px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.row:hover,.hl:hover{background:var(--hover)}
.row[aria-current="true"],.hl[aria-current="true"]{background:var(--accent-bg)}
.thumb{position:relative;flex:none;width:72px;height:48px;border-radius:var(--r-sm);overflow:hidden}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tt{font-size:var(--t-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{display:flex;gap:4px}
.fold{display:flex;align-items:center;gap:8px;width:128px;font-size:var(--t-sec);color:var(--muted)}
.fold i{width:12px;height:12px;border-radius:var(--r-xs)}
.date{width:64px;text-align:right;font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.hl{display:grid;grid-template-columns:16px minmax(0,1fr) 184px 128px 64px;align-items:center;gap:12px;width:100%;height:40px;padding:0 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.hl .t{font-size:var(--t-sec);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .m{font-size:var(--t-meta);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Empty library */
.empty{margin-top:24px;padding:48px 24px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.empty h2{margin:0;font-size:var(--d);line-height:1.15;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0;max-width:52ch;color:var(--muted)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:720px;margin-top:8px}
.start{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:var(--r-md);text-align:left;border:1px solid var(--line);background:var(--l1)}
.start:hover{border-color:var(--line-strong)}
.start b{font-size:var(--t-body);font-weight:600}
.start span{font-size:var(--t-sec);color:var(--muted)}

/* Link page */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px;flex:1;min-height:0}
.split.on{grid-template-columns:360px minmax(0,1fr)}
.mini{border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 104px);position:sticky;top:16px}
.mini .row{padding:8px 12px;gap:12px}
.mini .thumb{width:56px;height:40px}
.mini .row .tt{font-size:var(--t-sec)}
.lp{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;min-height:calc(100vh - 104px)}
.lp-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lp-title{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.lp-title b{font-size:var(--t-sec);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-title span{display:flex;align-items:center;gap:6px;font-size:var(--t-meta);color:var(--muted)}
.lp-tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lp-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.lp-body.details{grid-template-columns:minmax(0,1fr) 296px}
.view{min-width:0;overflow:auto;max-height:calc(100vh - 160px);position:relative}
.notice{display:flex;gap:8px;align-items:center;margin:12px 16px 0;padding:8px 12px;border-radius:var(--r-sm);background:var(--hover);font-size:var(--t-sec);color:var(--muted)}
/* Site stand-in */
.site{min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.site-bar{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;font-weight:700;font-size:15px}
.site-body{max-width:720px;margin:0 auto;padding:32px 24px 48px}
.site-body h2{margin:0 0 12px;font-size:32px;line-height:1.2}
.site-body p{margin:0 0 14px;font-size:16px;line-height:1.6}
.site-media{aspect-ratio:16/9;border-radius:6px;margin:8px 0 20px;overflow:hidden}
.blocked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:64px 24px;min-height:100%}
/* Reader */
.reader{--rs:1.125rem;--rw:68ch;--rfont:var(--font);background:var(--l1);color:var(--fg);min-height:100%}
.reader[data-size="s"]{--rs:1rem}.reader[data-size="l"]{--rs:1.27rem}
.reader[data-width="wide"]{--rw:84ch}
.reader[data-font="serif"]{--rfont:var(--serif)}.reader[data-font="readable"]{--rfont:var(--readable)}
.reader[data-tone="sepia"]{background:var(--sepia-bg);color:var(--sepia-fg)}
.reader[data-tone="sepia"] .r-meta,.reader[data-tone="sepia"] .r-sum{color:var(--sepia-muted)}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:2}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.article{max-width:var(--rw);margin:0 auto;padding:32px 24px 64px;font-family:var(--rfont);font-size:var(--rs);line-height:1.6}
.article .r-site{display:flex;align-items:center;gap:8px;font-family:var(--font);font-size:var(--t-sec);color:var(--muted)}
.article h2.r-title{margin:12px 0 8px;font-family:var(--rfont);font-size:var(--d);line-height:1.15;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.article .r-meta{font-family:var(--font);font-size:var(--t-sec);color:var(--muted);margin-bottom:24px}
.r-sum{display:flex;gap:8px;margin:0 0 24px;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);font-family:var(--font);font-size:var(--t-sec);color:var(--muted)}
.article h3{margin:32px 0 8px;font-size:1.27em;line-height:1.25;font-weight:600}
.article p{margin:0 0 1em}
.article blockquote{margin:1.5em 0;padding-left:16px;border-left:2px solid var(--line-strong);color:inherit;font-style:italic}
.article ul{margin:0 0 1em;padding-left:1.25em}
.article figure{margin:1.5em 0}
.article figure div{aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden}
.article figcaption{margin-top:8px;font-family:var(--font);font-size:var(--t-meta);color:var(--muted)}
/* Details */

    pd:{author:'Mara Lind',date:'12 Mar 2026',min:6,blocks:[
      ['p','Most screens try to show everything a person might need. The result is a wall of options where the common task hides among the rare ones. Progressive disclosure is the habit of showing the few things most people use first, and keeping the rest one deliberate step away.'],
      ['h','Start from the first task'],
      ['p','Watch what people do in their first minute. Those actions belong on the surface. Everything else can wait behind a clearly named control: "More options", "Advanced", or a second step in a flow.'],
      ['q','A good default screen answers the question the person came with, and quietly tells them that more is available.'],
      ['h','Make the next layer easy to find'],
      ['p','Hiding is only half of the work. The step to the advanced layer needs a plain label and a stable place, so people learn where to look. If they have to hunt for it, the design has only moved the clutter somewhere less visible.'],
      ['ul',['Keep the hidden layer one step away, not three.','Name it by what it holds, not by how it works.','Remember when someone opened it, and keep it open for them.']],
      ['fig','A settings panel with the common choices on top and an "Advanced" section folded below.'],
      ['h','When not to do it'],

<style>

<script>(function(){
