<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Switch</title></head><body>
<div class="sm-root">
<div style="display:flex;gap:12px;align-items:center;font-size:.875rem"><button class="sm-switch" role="switch" aria-checked="true" aria-label="Search by meaning"></button>Search by meaning</div>
<div style="display:flex;gap:12px;align-items:center;font-size:.875rem"><button class="sm-switch" role="switch" aria-checked="false" aria-label="Include my notes"></button>Include my notes</div>
<div style="display:flex;gap:8px;align-items:center;font-size:.875rem"><span class="sm-check" role="checkbox" aria-checked="true" aria-label="Select"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Selected</div>
</div>
</body></html>
