<!-- @dsCard group="Actions" height=110 -->
<style>html,body{margin:0}</style>
<div class="sm-root" style="padding:24px;background:var(--bg);min-height:100%"><p style="margin:0 0 10px;font:500 12px/16px var(--font-sans);color:var(--text-muted)">Click to switch: the thumb slides</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div class="sm-seg sm-seg--slide demo-seg" role="radiogroup" aria-label="View" style="--seg-n:2;--seg-i:0"><button class="sm-seg__item is-active" role="radio" aria-checked="true"><i class="ti ti-layout-grid sm-ico" aria-hidden="true"></i>Cards</button><button class="sm-seg__item" role="radio" aria-checked="false"><i class="ti ti-list sm-ico" aria-hidden="true"></i>List</button></div>
<div class="sm-seg sm-seg--slide demo-seg" role="radiogroup" aria-label="View" style="--seg-n:2;--seg-i:0"><button class="sm-seg__item is-active" role="radio" aria-label="Cards" aria-checked="true"><i class="ti ti-layout-grid sm-ico" aria-hidden="true"></i></button><button class="sm-seg__item" role="radio" aria-label="List" aria-checked="false"><i class="ti ti-list sm-ico" aria-hidden="true"></i></button></div>
<div class="sm-seg sm-seg--slide demo-seg" role="radiogroup" aria-label="Theme" style="--seg-n:3;--seg-i:0"><button class="sm-seg__item is-active" role="radio" aria-checked="true">System</button><button class="sm-seg__item" role="radio" aria-checked="false">Light</button><button class="sm-seg__item" role="radio" aria-checked="false">Dark</button></div>
</div></div>
<script>
document.querySelectorAll('.demo-seg').forEach(function(seg){
  var items=[].slice.call(seg.querySelectorAll('.sm-seg__item'));
  items.forEach(function(b,i){ b.addEventListener('click',function(){
    seg.style.setProperty('--seg-i',i);
    items.forEach(function(x,j){ x.classList.toggle('is-active',i===j); x.setAttribute('aria-checked',String(i===j)); });
  }); });
});
</script>
