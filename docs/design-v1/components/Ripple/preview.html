<!-- @dsCard group="Feedback" height=300 -->
<style>html,body{margin:0}.cap{margin:0 0 8px;font:500 12px/16px var(--font-sans);color:var(--text-muted)}</style>
<div class="sm-root" style="padding:24px;background:var(--bg);min-height:100%;display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start">
<div><p class="cap">Sidebar rows — click or press and hold</p>
<div class="sm-tree" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px">
<div class="sm-tree__row rp">All links<span class="sm-tree__count">248</span></div>
<div class="sm-tree__row rp">Unsorted<span class="sm-tree__count">17</span></div>
<div class="sm-tree__row rp is-active">Angular<span class="sm-tree__count">12</span></div>
<div class="sm-tree__row rp">Clothes<span class="sm-tree__count">21</span></div>
</div></div>
<div style="display:flex;flex-direction:column;gap:18px">
<div><p class="cap">Menu items and list rows</p>
<div class="sm-menu" style="width:240px"><button class="sm-menu__item rp">Edit</button><button class="sm-menu__item rp">Move to folder</button><button class="sm-menu__item sm-menu__item--danger rp">Delete</button></div></div>
<div><p class="cap">Ghost and icon buttons, tag chips</p>
<div style="display:flex;gap:8px;align-items:center"><button class="sm-btn sm-btn--ghost rp">Newest first</button><button class="sm-btn sm-btn--ghost sm-btn--icon rp" aria-label="More">⋯</button><button class="sm-chip sm-chip--clickable rp">angular</button><button class="sm-chip sm-chip--clickable rp">video</button></div></div>
</div></div>
<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.rp').forEach(function(el){
    el.classList.add('sm-ripple-host');
    el.addEventListener('pointerdown',function(e){
      if(reduce)return;
      var r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      var d=2*Math.max(Math.hypot(x,y),Math.hypot(r.width-x,y),Math.hypot(x,r.height-y),Math.hypot(r.width-x,r.height-y));
      var s=document.createElement('span');s.className='sm-ripple';s.style.width=s.style.height=d+'px';s.style.left=(x-d/2)+'px';s.style.top=(y-d/2)+'px';
      el.appendChild(s);
      function up(){s.classList.add('is-out');window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);}
      window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
      s.addEventListener('animationend',function(ev){if(ev.animationName==='sm-ripple-fade')s.remove();});
    });
  });
})();
</script>
