<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add link on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/shelfmark/tokens.css">
<link rel="stylesheet" href="ds/shelfmark/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif;">
<div aria-hidden="true" style="height: 56px; border-bottom: 1px solid var(--border); background: var(--surface);"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>
<form class="sm-sheet" role="dialog" aria-modal="true" aria-labelledby="ma-t" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; gap: 14px; animation: sm-slide-up var(--duration-slow) var(--ease-out);">
<div class="sm-sheet__grip" aria-hidden="true"></div>
<div style="display: flex; align-items: center; justify-content: space-between;"><h2 id="ma-t" style="margin: 0; font-size: 20px; font-weight: 600;">Add link</h2><button type="button" class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Close" style="width: 44px; height: 44px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<div class="sm-field"><label class="sm-field__label" for="ma-url">Link</label><div class="sm-field__control sm-field__control--url" style="min-height: 48px;"><input id="ma-url" value="https://www.cos.com/en/wool-coat"></div></div>
<div style="display: flex; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg);">
<div style="width: 88px; flex: none; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); background: var(--accent-bg);"></div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;"><div class="sm-card__meta"><span class="sm-favicon">C</span>cos.com</div><div style="font-size: 14px; line-height: 20px; font-weight: 600;">Wool coat, straight cut, graphite</div></div>
</div>
<div class="sm-field"><label class="sm-field__label">Folder</label><div class="sm-field__control" style="min-height: 48px;"><span class="sm-select__value">Clothes</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div></div>
<div class="sm-field"><label class="sm-field__label">Tags</label><div class="sm-field__control sm-taginput" style="min-height: 48px;"><span class="sm-chip">clothes</span><input aria-label="Add tag" placeholder="Add tag"></div></div>
<div class="sm-field"><label class="sm-field__label" for="ma-n">Note</label><div class="sm-field__control sm-field__control--textarea"><textarea id="ma-n" rows="2" placeholder="Why are you saving this?">Wait for the sale, size M</textarea></div></div>
<button type="submit" class="sm-btn sm-btn--primary sm-btn--lg" style="width: 100%; height: 48px;">Save link</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
