<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/shelfmark/tokens.css">
<link rel="stylesheet" href="ds/shelfmark/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root" style="width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif; display: flex; flex-direction: column;">
<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border); background: var(--surface);">
<a href="#" class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Back" style="width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">Settings</h1>
</header>
<div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
<section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; align-items: center; gap: 12px;">
<span class="sm-avatar sm-avatar--lg">DD</span>
<div style="flex: 1; min-width: 0;"><div style="font-size: 15px; font-weight: 600;">Dmytro</div><div style="font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Google, dmytro@example.com</div></div>
</section>
<section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-size: 15px; font-weight: 600;">Appearance</h2>
<div class="sm-seg" role="radiogroup" aria-label="Theme" style="display: flex;"><button class="sm-seg__item is-active" role="radio" aria-checked="true" style="flex: 1; justify-content: center; height: 36px;">System</button><button class="sm-seg__item" role="radio" aria-checked="false" style="flex: 1; justify-content: center; height: 36px;">Light</button><button class="sm-seg__item" role="radio" aria-checked="false" style="flex: 1; justify-content: center; height: 36px;">Dark</button></div>
<div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 14px;">Language</span><span style="font-size: 14px; color: var(--text-muted);">English ›</span></div>
</section>
<a href="#" style="text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; align-items: center; justify-content: space-between; min-height: 24px;"><span style="font-size: 14px;">Export your data</span><span style="color: var(--text-muted);">JSON or HTML ›</span></a>
<a href="#" style="text-decoration: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; align-items: center; justify-content: space-between; min-height: 24px;"><span style="font-size: 14px;">Show welcome again</span><span style="color: var(--text-muted);">›</span></a>
<button class="sm-btn sm-btn--secondary sm-btn--lg" style="width: 100%; height: 48px;">Sign out</button>
<button class="sm-btn sm-btn--ghost sm-btn--lg" style="width: 100%; height: 48px; color: var(--danger);">Delete account</button>
<p style="margin: auto 0 0; text-align: center; font-size: 12px; color: var(--text-muted);"><a href="#">Privacy policy</a>&nbsp;&nbsp;&nbsp;Shelfmark v1.0</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
