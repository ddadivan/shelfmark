<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelfmark menu on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/shelfmark/tokens.css">
<link rel="stylesheet" href="ds/shelfmark/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>
<nav aria-label="Library" style="position: absolute; top: 0; bottom: 0; left: 0; width: 312px; background: var(--surface); box-shadow: var(--shadow-popover); display: flex; flex-direction: column; animation: sm-slide-up var(--duration-slow) var(--ease-out);">
<div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border);">
<span style="display: flex; align-items: center; gap: 8px;"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" style="fill: var(--primary)"/><path d="M19 5h6v11l-3-2.4-3 2.4z" style="fill: var(--logo-bookmark)"/></svg><span style="font-size: 16px; font-weight: 600;">Shelfmark</span></span>
<button class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Close menu" style="width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</div>
<div style="flex: 1; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;">All links<span class="sm-tree__count">248</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;">Unsorted<span class="sm-tree__count">17</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;">Favorites<span class="sm-tree__count">9</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;">Recently opened</a>
<div class="sm-tree__section">Folders</div>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;"><span class="sm-tree__twist is-open">›</span>Work<span class="sm-tree__count">34</span></a>
<a href="#" class="sm-tree__row is-active" style="height: 44px; text-decoration: none; padding-left: 32px;">Angular<span class="sm-tree__count">12</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none; padding-left: 32px;">Courses<span class="sm-tree__count">8</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;"><span class="sm-tree__twist">›</span>Clothes<span class="sm-tree__count">21</span></a>
<a href="#" class="sm-tree__row" style="height: 44px; text-decoration: none;"><span class="sm-tree__twist"></span>Recipes<span class="sm-tree__count">15</span></a>
<div class="sm-tree__section">Tags</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 8px;"><button class="sm-chip sm-chip--clickable">angular</button><button class="sm-chip sm-chip--clickable">courses</button><button class="sm-chip sm-chip--clickable">clothes</button><button class="sm-chip sm-chip--clickable">video</button></div>
</div>
<div style="border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px;">
<span class="sm-avatar">DD</span><span style="flex: 1; font-size: 14px; font-weight: 500;">Dmytro</span>
<button class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Switch theme" style="width: 44px; height: 44px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>

</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
