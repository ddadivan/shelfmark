<style>html,body{margin:0}</style>
<div class="sm-root" style="padding:24px;background:var(--bg);min-height:100%;font-family:var(--font-sans);color:var(--text)"><div style="position:relative;height:120px;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,var(--accent-bg),var(--surface-pressed))"><div class="sm-glass" style="position:absolute;left:24px;right:24px;top:28px;height:64px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 12px"><span style="font-size:14px;font-weight:600;padding:0 8px">3 selected</span><button class="sm-btn sm-btn--ghost sm-btn--sm">Move</button><button class="sm-btn sm-btn--ghost sm-btn--sm">Favorite</button><button class="sm-btn sm-btn--ghost sm-btn--sm" style="color:var(--danger)">Delete</button></div></div></div>
