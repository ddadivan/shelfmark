<!-- @dsCard group="Brand" height=330 -->
<style>
html,body{margin:0}
.il{fill:none}.ink{fill:var(--primary)}.sage{fill:var(--accent)}.tint{fill:var(--accent-bg)}.surf{fill:var(--surface);stroke:var(--border);stroke-width:1}.line{fill:var(--surface-pressed)}.muted{fill:var(--text-muted)}.mark{fill:var(--logo-bookmark)}
.dash{fill:none;stroke:var(--border-control);stroke-width:1.5;stroke-dasharray:5 5}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
.sc svg{width:100%;height:auto;display:block;border-radius:var(--radius-md);background:var(--bg)}
.cap{font:500 13px/18px var(--font-sans);color:var(--text)}.sub{font:400 12px/16px var(--font-sans);color:var(--text-muted)}
@keyframes fly1{0%,10%{transform:translate(-62px,-30px) rotate(-14deg)}45%,85%{transform:none}100%{transform:translate(-62px,-30px) rotate(-14deg)}}
@keyframes fly2{0%,15%{transform:translate(-80px,34px) rotate(12deg)}50%,85%{transform:none}100%{transform:translate(-80px,34px) rotate(12deg)}}
@keyframes fly3{0%,20%{transform:translate(-30px,48px) rotate(-8deg)}55%,85%{transform:none}100%{transform:translate(-30px,48px) rotate(-8deg)}}
@keyframes fly4{0%,25%{transform:translate(-96px,-6px) rotate(18deg)}60%,85%{transform:none}100%{transform:translate(-96px,-6px) rotate(18deg)}}
@keyframes grow{0%,20%{transform:translateY(-34px) scale(.3);opacity:0}50%,85%{transform:none;opacity:1}100%{transform:translateY(-34px) scale(.3);opacity:0}}
@keyframes typing{0%,10%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes pick{0%,30%{opacity:.25}50%,85%{opacity:1}100%{opacity:.25}}
@keyframes fade{0%,30%{opacity:1}50%,85%{opacity:.2}100%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scan{0%,100%{transform:translate(-26px,0)}50%{transform:translate(26px,0)}}
@keyframes apart{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes apart2{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.a{transform-box:fill-box;transform-origin:center;animation-duration:4.8s;animation-iteration-count:infinite;animation-delay:.2s;animation-timing-function:var(--ease-out)}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style>
<style>
@keyframes cardIn{0%{transform:scale(.6);opacity:0}20%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes markDrop{0%,15%{transform:translateY(-14px);opacity:0}32%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes wordIn{0%,25%{opacity:0;transform:translateX(-8px)}42%,85%{opacity:1;transform:none}100%{opacity:0}}
@keyframes drop{0%,15%{transform:translateY(-60px);opacity:0}40%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes shift{0%,15%{transform:translateX(-52px)}40%,100%{transform:none}}
@keyframes star{0%,40%{transform:scale(1);fill:var(--text-muted)}50%{transform:scale(1.3);fill:var(--accent)}60%,90%{transform:scale(1);fill:var(--accent)}100%{fill:var(--text-muted)}}
.m{transform-box:fill-box;transform-origin:center;animation-duration:3.6s;animation-iteration-count:infinite;animation-delay:.2s;animation-timing-function:var(--ease-out)}
@media (prefers-reduced-motion:reduce){.m{animation:none!important}}
</style>
<div class="sm-root" style="padding:20px;background:var(--bg)"><div class="grid">
<div class="sc"><svg viewBox="0 0 240 150" role="img" aria-label="Logo intro"><g transform="translate(46 47)"><g class="m" style="animation-name:cardIn;animation-timing-function:var(--ease-spring)"><rect class="ink" x="3" y="5" width="52" height="44" rx="12"/></g><path class="mark m" style="animation-name:markDrop;animation-timing-function:var(--ease-spring)" d="M35 5h12v22l-6-4.8-6 4.8z"/></g><text class="m" style="animation-name:wordIn" x="114" y="84" font-family="Onest, sans-serif" font-size="22" font-weight="600" fill="var(--text)">Shelfmark</text></svg><div><div class="cap">App load</div><div class="sub">Card, then bookmark, then name · ease-spring</div></div></div>
<div class="sc"><svg viewBox="0 0 240 150" role="img" aria-label="A new link takes its place in the feed"><g class="m" style="animation-name:drop;animation-timing-function:var(--ease-spring)"><rect class="surf" x="20" y="62" width="48" height="40" rx="6"/><rect class="tint" x="24" y="66" width="40" height="18" rx="3"/><rect class="line" x="24" y="87" width="31" height="4" rx="2"/><rect class="line" x="24" y="94" width="19" height="4" rx="2"/></g><g class="m" style="animation-name:shift"><g ><rect class="surf" x="76" y="62" width="48" height="40" rx="6"/><rect class="tint" x="80" y="66" width="40" height="18" rx="3"/><rect class="line" x="80" y="87" width="31" height="4" rx="2"/><rect class="line" x="80" y="94" width="19" height="4" rx="2"/></g><g ><rect class="surf" x="132" y="62" width="48" height="40" rx="6"/><rect class="tint" x="136" y="66" width="40" height="18" rx="3"/><rect class="line" x="136" y="87" width="31" height="4" rx="2"/><rect class="line" x="136" y="94" width="19" height="4" rx="2"/></g><g ><rect class="surf" x="188" y="62" width="48" height="40" rx="6"/><rect class="tint" x="192" y="66" width="40" height="18" rx="3"/><rect class="line" x="192" y="87" width="31" height="4" rx="2"/><rect class="line" x="192" y="94" width="19" height="4" rx="2"/></g></g></svg><div><div class="cap">Saving a link</div><div class="sub">The card drops in, the feed shifts · duration-slow</div></div></div>
<div class="sc"><svg viewBox="0 0 240 150" role="img" aria-label="Favorite star"><path class="m" style="animation-name:star;animation-timing-function:var(--ease-spring)" d="M120 45l9.4 19 21 3-15.2 14.8 3.6 20.9L120 92.8l-18.8 9.9 3.6-20.9L89.6 67l21-3z"/></svg><div><div class="cap">Favorites</div><div class="sub">The star pops and turns sage</div></div></div>
</div></div>
