/* sign-in mosaic: tiles assemble once, then one tile at a time "lands" like a newly saved link */

.sg-l{transform-box:fill-box;transform-origin:50% 100%;animation:sg-land 24s var(--ease-out) calc(var(--n) * 3s + 1.6s) infinite}
@keyframes sg-land{0%,1%{transform:none}2.2%{transform:translateY(-10px) scale(.97)}4.2%{transform:none}100%{transform:none}}
.sg-ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;animation:sg-ring 24s var(--ease-out) calc(var(--n) * 3s + 1.6s) infinite}
@keyframes sg-ring{0%,2%{opacity:0}3.5%{opacity:1}9%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sg-t,.sg-t .sg-d,.sg-l,.sg-ring{animation:none!important}}
