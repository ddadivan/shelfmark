<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Add link</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<link rel="stylesheet" href="boards.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root dir-a" style="min-height: 900px; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif; position: relative;">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px;">
<div style="width: 272px; background: var(--surface); border-radius: 22px;"></div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding: 140px 16px 0; align-content: start;">
<div style="height: 280px; background: var(--surface); border-radius: 22px;"></div><div style="height: 280px; background: var(--surface); border-radius: 22px;"></div><div style="height: 280px; background: var(--surface); border-radius: 22px;"></div>
</div>
</div>
<div class="sm-scrim" style="position: absolute; inset: 0;">
<form class="sm-dialog sm-dialog--md" role="dialog" aria-modal="true" aria-labelledby="add-title" style="gap: 20px;">
<div class="sm-dialog__head"><h2 id="add-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.02em;">Add link</h2><button type="button" class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>

<div class="sm-field"><label class="sm-field__label" for="aa-url">Link</label><div class="sm-field__control sm-field__control--url" style="min-height: 52px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="color: var(--text-muted);"><path d="M9.5 14.5l5-5M8 12l-1.8 1.8a3.2 3.2 0 0 0 4.5 4.5l1.8-1.8M16 12l1.8-1.8a3.2 3.2 0 0 0-4.5-4.5L11.5 7.5"/></svg><input id="aa-url" value="https://youtube.com/watch?v=ng22-signal-forms" style="font-family: var(--font-mono); font-size: 13px;"></div></div>

<div style="display: flex; gap: 14px; align-items: center; padding: 8px; border-radius: 20px; background: var(--bg);">
<div style="width: 148px; aspect-ratio: 16 / 10; border-radius: 14px; background: var(--accent-bg); flex: none;"></div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted);"><span class="sm-favicon">Y</span>youtube.com</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 600;">Angular 22: everything about Signal Forms in 20 minutes</span>
<span style="font-size: 12px; color: var(--text-muted);">Filled in from the page. You can edit the title.</span>
</div>
</div>

<div class="sm-field"><label class="sm-field__label" for="aa-folder">Folder</label><div class="sm-field__control" id="aa-folder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-muted);"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span class="sm-select__value" style="flex: 1;">Work / Angular</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div></div>

<div class="sm-field"><label class="sm-field__label" for="aa-tags">Tags</label>
<div class="sm-field__control sm-taginput"><span class="sm-chip">angular<button type="button" class="sm-chip__remove" aria-label="Remove tag angular"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></span><input id="aa-tags" placeholder="Add tag"></div>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted);">Suggested from your other youtube.com links:<button type="button" class="sm-chip sm-chip--neutral sm-chip--clickable">+ video</button><button type="button" class="sm-chip sm-chip--neutral sm-chip--clickable">+ watch-later</button></div>
</div>

<div class="sm-field"><label class="sm-field__label" for="aa-note">Note</label><div class="sm-field__control sm-field__control--textarea"><textarea id="aa-note" rows="2" placeholder="Why are you saving this?">Watch on the weekend</textarea></div></div>

<div class="sm-dialog__foot" style="align-items: center;"><span style="margin-right: auto; font-size: 12px; color: var(--text-muted);"><span class="sm-kbd">⌘</span> <span class="sm-kbd">Enter</span> to save</span><button type="button" class="sm-btn sm-btn--secondary">Cancel</button><button type="submit" class="sm-btn sm-btn--primary">Save link</button></div>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
