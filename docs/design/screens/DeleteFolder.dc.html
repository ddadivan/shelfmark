<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Delete folder</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<link rel="stylesheet" href="boards.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root dir-a" style="min-height: 900px; position: relative; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif;">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px;">
<div style="width: 272px; flex: none; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-card);"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 6px 16px;"><div style="height: 48px; max-width: 640px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-card);"></div><div style="height: 44px; width: 220px; border-radius: 12px; background: var(--surface-hover);"></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;"><div style="height: 300px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card);"></div><div style="height: 300px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card);"></div><div style="height: 300px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card);"></div></div></div>
</div>
<div class="sm-scrim" style="position: absolute; inset: 0;">
<div class="sm-dialog sm-pop-in" role="alertdialog" aria-modal="true" aria-labelledby="d-title" aria-describedby="d-text" style="max-width: 460px;">
<div class="sm-dialog__head"><h2 id="d-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Delete folder “Work”?</h2><button class="sm-btn sm-btn--ghost sm-btn--icon sm-btn--sm" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<p id="d-text" style="margin: 0; color: var(--text-muted);">It has 34 links and 2 subfolders. What should happen to the links?</p>
<div class="sm-radio-group" role="radiogroup">
<label class="sm-radio {{moveCls}}" onClick="{{pickMove}}"><span class="sm-radio__dot"></span><span><span class="sm-radio__title" style="display: block;">Move links to Unsorted</span><span class="sm-radio__desc" style="display: block;">Folders are deleted, all 34 links stay</span></span></label>
<label class="sm-radio {{delCls}}" onClick="{{pickDelete}}"><span class="sm-radio__dot"></span><span><span class="sm-radio__title" style="display: block;">Delete links too</span><span class="sm-radio__desc" style="display: block;">This can't be undone</span></span></label>
</div>
<div class="sm-dialog__foot"><button class="sm-btn sm-btn--secondary">Cancel</button><button class="sm-btn sm-btn--danger">{{cta}}</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state || {}).mode ?? 'move';
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      moveCls: mode === 'move' ? 'is-checked' : '',
      delCls: mode === 'delete' ? 'is-checked' : '',
      cta: mode === 'move' ? 'Delete folder' : 'Delete folder and 34 links',
      pickMove: () => this.setState({ mode: 'move' }),
      pickDelete: () => this.setState({ mode: 'delete' })
    };
  }
}
</script>
</body>
</html>
