<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--text-muted)}a:hover{color:var(--text)}

/* sign-in mosaic: tiles assemble once, then one tile at a time "lands" like a newly saved link */
.sg-t{transform-box:fill-box;transform-origin:50% 100%;animation:sg-in 600ms var(--ease-out) calc(var(--i) * 70ms + 150ms) both}
@keyframes sg-in{from{opacity:0;transform:translateY(18px) scale(.92)}}
.sg-t .sg-d{animation:sg-pop 360ms var(--ease-spring) calc(var(--i) * 70ms + 650ms) both;transform-box:fill-box;transform-origin:left center}
@keyframes sg-pop{from{opacity:0;transform:scale(.6)}}
.sg-l{transform-box:fill-box;transform-origin:50% 100%;animation:sg-land 24s var(--ease-out) calc(var(--n) * 3s + 1.6s) infinite}
@keyframes sg-land{0%,1%{transform:none}2.2%{transform:translateY(-10px) scale(.97)}4.2%{transform:none}100%{transform:none}}
.sg-ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;animation:sg-ring 24s var(--ease-out) calc(var(--n) * 3s + 1.6s) infinite}
@keyframes sg-ring{0%,2%{opacity:0}3.5%{opacity:1}9%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sg-t,.sg-t .sg-d,.sg-l,.sg-ring{animation:none!important}}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root dir-a" style="width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif; display: flex; flex-direction: column;">
<div aria-hidden="true" style="height: 300px; flex: none; background: var(--surface); border-bottom: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center;">
<svg viewBox="0 0 390 300" width="390" height="300">
<g class="sg-t" style="--i: 0;"><g class="sg-l" style="--n: 2;"><rect x="-30" y="-20" width="130" height="110" rx="14" style="fill: var(--accent-bg)"/><rect class="sg-ring" style="--n: 2;" x="-28.5" y="-18.5" width="127" height="107" rx="13"/></g></g>
<g class="sg-t" style="--i: 1;"><g class="sg-l" style="--n: 5;"><rect x="116" y="-20" width="130" height="110" rx="14" style="fill: var(--primary)"/><rect class="sg-d" x="132" y="2" width="16" height="16" rx="4" style="fill: var(--bg)"/><rect class="sg-ring" style="--n: 5;" x="117.5" y="-18.5" width="127" height="107" rx="13"/></g></g>
<g class="sg-t" style="--i: 2;"><g class="sg-l" style="--n: 0;"><rect x="262" y="-20" width="160" height="110" rx="14" style="fill: var(--accent)"/><rect class="sg-ring" style="--n: 0;" x="263.5" y="-18.5" width="157" height="107" rx="13"/></g></g>
<g class="sg-t" style="--i: 3;"><g class="sg-l" style="--n: 7;"><rect x="-30" y="106" width="130" height="90" rx="14" style="fill: var(--accent)"/><rect class="sg-ring" style="--n: 7;" x="-28.5" y="107.5" width="127" height="87" rx="13"/></g></g>
<g class="sg-t" style="--i: 4;"><g class="sg-l" style="--n: 3;"><rect x="116" y="106" width="306" height="90" rx="14" style="fill: var(--accent-bg)"/><rect class="sg-d" x="132" y="166" width="60" height="16" rx="8" style="fill: var(--accent)"/><rect class="sg-d" x="200" y="166" width="44" height="16" rx="8" style="fill: var(--accent)"/><rect class="sg-ring" style="--n: 3;" x="117.5" y="107.5" width="303" height="87" rx="13"/></g></g>
<g class="sg-t" style="--i: 5;"><g class="sg-l" style="--n: 6;"><rect x="-30" y="212" width="130" height="110" rx="14" style="fill: var(--primary)"/><rect class="sg-ring" style="--n: 6;" x="-28.5" y="213.5" width="127" height="107" rx="13"/></g></g>
<g class="sg-t" style="--i: 6;"><g class="sg-l" style="--n: 1;"><rect x="116" y="212" width="130" height="110" rx="14" style="fill: var(--accent-bg)"/><rect class="sg-ring" style="--n: 1;" x="117.5" y="213.5" width="127" height="107" rx="13"/></g></g>
<g class="sg-t" style="--i: 7;"><g class="sg-l" style="--n: 4;"><rect x="262" y="212" width="160" height="110" rx="14" style="fill: var(--text-muted)"/><rect class="sg-ring" style="--n: 4;" x="263.5" y="213.5" width="157" height="107" rx="13"/></g></g>
</svg>
</div>
<div style="flex: 1; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: center; gap: 8px;"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" style="fill: var(--primary)"/><path d="M19 5h6v11l-3-2.4-3 2.4z" style="fill: var(--logo-bookmark)"/></svg><span style="font-size: 16px; font-weight: 600;">Shelfmark</span></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">All your links on one shelf</h1><p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-muted);">Save anything once, find it again in seconds.</p></div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<button class="sm-btn sm-btn--secondary sm-btn--lg" style="width: 100%; height: 48px;">Continue with Google</button>
<button class="sm-btn sm-btn--secondary sm-btn--lg" style="width: 100%; height: 48px;">Continue with GitHub</button>
</div>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--text-muted);">By continuing you agree to the <a href="#">Privacy policy</a>.</p>
</div>
</div>
