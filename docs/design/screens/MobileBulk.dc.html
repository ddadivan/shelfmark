<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Select links · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<link rel="stylesheet" href="boards.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root dir-a" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 6px; padding: 12px 8px 8px;">
<button class="sm-btn sm-btn--ghost sm-btn--icon" aria-label="Cancel selection" style="width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<b style="font-size: 18px; font-weight: 600; flex: 1;">3 selected</b>
<button class="sm-btn sm-btn--ghost">Select all</button>
</div>
<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column;">
<div style="background: var(--surface); box-shadow: var(--shadow-card); border-radius: 22px; padding: 6px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<label class="sm-row" style="min-height: 64px; cursor: pointer; background: {{r.bgRow}};"><input type="checkbox" class="sm-check" checked="{{r.on}}" aria-label="Select {{r.title}}"><span class="sm-row__thumb" style="width: 48px; height: 48px; background: {{r.bg}};"></span><span class="sm-row__main"><span class="sm-row__title">{{r.title}}</span><span class="sm-row__meta">{{r.site}}</span></span></label>
</sc-for>
</div>
<p class="a-note" style="padding: 12px 6px;">Long-press a link to start selecting, then tap others.</p>
</div>
<div role="toolbar" aria-label="Actions for 3 selected links" class="sm-glass" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 68px; border-radius: 26px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">
<button class="sm-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M9 13.5h6M13 11.5l2 2-2 2"/></svg>Move</button>
<button class="sm-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h5.6a2 2 0 0 1 1.4.6l7.4 7.4a2 2 0 0 1 0 2.8l-5 5a2 2 0 0 1-2.8 0L4.6 12.4A2 2 0 0 1 4 11z"/></svg>Tags</button>
<button class="sm-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8l2.45 5 5.5.8-4 3.9.95 5.5L12 16.4 7.1 19l.95-5.5-4-3.9 5.5-.8z"/></svg>Favorite</button>
<button class="sm-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h11v11"/><path d="M19 4L8 15"/><rect x="4" y="9" width="11" height="11" rx="3"/></svg>Share</button>
<button class="sm-tab" style="color: var(--danger);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M6.5 7l.8 11.2a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8L17.5 7"/></svg>Delete</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = 'var(--accent-bg)', h = 'var(--surface-hover)', p = 'var(--surface-pressed)';
    const rows = [
      { title: 'Wool coat, straight cut, graphite', site: 'cos.com', bg: t, on: true },
      { title: 'Merino crew-neck jumper', site: 'uniqlo.com', bg: h, on: true },
      { title: 'Leather Chelsea boots', site: 'drmartens.com', bg: p, on: false },
      { title: 'Relaxed straight jeans', site: 'levi.com', bg: t, on: true },
      { title: 'Canvas tote bag', site: 'arket.com', bg: h, on: false },
      { title: 'Rain jacket, packable', site: 'rains.com', bg: p, on: false },
      { title: 'Wool scarf, charcoal', site: 'cos.com', bg: t, on: false }
    ];
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      rows: rows.map(r => ({ ...r, bgRow: r.on ? 'var(--surface-hover)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
