<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Shelfmark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/shelfmark/tokens.css">
<link rel="stylesheet" href="ds/shelfmark/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--text-muted)}a:hover{color:var(--text)}


/* sign-in mosaic: parallax on mouse move, cards lift on hover and flip on click to show the saved link */
.mz{position:relative;width:100%;max-width:560px;--px:0;--py:0}
.mz-grid{position:relative;height:372px;--cw:calc((100% - 32px) / 3)}
.mz-tile{position:absolute;transition:left 800ms var(--ease-in-out),top 800ms var(--ease-in-out),width 800ms var(--ease-in-out),height 800ms var(--ease-in-out)}
.slot-a{left:0;top:0;width:var(--cw);height:120px}
.slot-b{left:calc(var(--cw) + 16px);top:0;width:var(--cw);height:120px}
.slot-c{left:calc(var(--cw) * 2 + 32px);top:0;width:var(--cw);height:120px}
.slot-d{left:0;top:136px;width:var(--cw);height:100px}
.slot-e{left:calc(var(--cw) + 16px);top:136px;width:calc(var(--cw) * 2 + 16px);height:100px}
.slot-f{left:0;top:252px;width:var(--cw);height:120px}
.slot-g{left:calc(var(--cw) + 16px);top:252px;width:var(--cw);height:120px}
.slot-h{left:calc(var(--cw) * 2 + 32px);top:252px;width:var(--cw);height:120px}
.mz-tile.mz-tile{animation:mz-in 600ms var(--ease-out) calc(var(--i) * 70ms + 150ms) backwards;perspective:900px}
@keyframes mz-in{from{opacity:0;transform:translateY(18px) scale(.92)}}
.mz-px{height:100%;transform:translate(calc(var(--px) * var(--d) * 14px),calc(var(--py) * var(--d) * 12px));transition:transform 500ms var(--ease-out)}
.mz-inner{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:14px;transform-style:preserve-3d;transition:transform 520ms var(--ease-out),box-shadow 320ms var(--ease-out)}
.mz-inner:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
@media (hover:hover){.mz-inner:hover{transform:translateY(-6px) rotateX(4deg);box-shadow:0 22px 40px -22px rgba(24,24,26,.45)}}
.mz-inner.is-flipped{transform:rotateY(180deg)}
@media (hover:hover){.mz-inner.is-flipped:hover{transform:rotateY(180deg) translateY(-6px)}}
.mz-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:16px;box-sizing:border-box;text-align:left}
.mz-back{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--border);gap:6px;justify-content:center;box-shadow:0 0 0 1px var(--border)}
.mz-title{font:600 14px/19px var(--font-sans);color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mz-note{font:400 12px/16px var(--font-sans);color:var(--text-muted)}
.mz-pill{display:block;height:16px;border-radius:8px;background:var(--accent)}
.mz-sq{display:block;width:16px;height:16px;border-radius:4px;background:var(--bg)}
.mz-ring{position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 3px var(--accent);opacity:0;pointer-events:none;animation:mz-ring 24s var(--ease-out) calc(var(--n) * 3s + 1.6s) infinite}
@keyframes mz-ring{0%,2%{opacity:0}3.5%{opacity:1}9%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mz-tile,.mz-ring{animation:none!important;transition:none!important}.mz-px{transform:none!important}.mz-inner{transition:none!important}}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root" style="min-height: 900px; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif; display: flex; flex-wrap: wrap;">

<section style="flex: 1 1 420px; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; gap: 40px;">
<a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" style="fill: var(--primary)"/><path d="M19 5h6v11l-3-2.4-3 2.4z" style="fill: var(--logo-bookmark)"/></svg>
<span style="font-size: 18px; font-weight: 600; color: var(--text);">Shelfmark</span>
</a>

<div style="max-width: 400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em;">All your links on one shelf</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-muted);">Save videos, articles, things to buy and courses in one place — and actually find them again.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<button class="sm-btn sm-btn--secondary sm-btn--lg" style="width: 100%;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z" fill="#EA4335"/></svg>Continue with Google</button>
<button class="sm-btn sm-btn--secondary sm-btn--lg" style="width: 100%;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.8V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>Continue with GitHub</button>
</div>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--text-muted);">By continuing you agree to the <a href="#">Privacy policy</a>. We only use your name, email and avatar.</p>
</div>

<p style="margin: 0; font-size: 12px; color: var(--text-muted);">© 2026 Shelfmark</p>
</section>

<section aria-label="Examples of saved links" style="flex: 1 1 520px; min-height: 420px; background: var(--surface); border-left: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 40px; overflow: hidden;">
<div class="mz" onPointerMove="{{tilt}}" onPointerLeave="{{untilt}}"><div class="mz-grid">
<div class="mz-tile {{p0}}" style="--i: 0; --d: 0.6;"><div class="mz-px"><button type="button" class="mz-inner {{f0}}" onClick="{{flip0}}" aria-label="Signal Forms in 20 minutes, youtube.com">
<span class="mz-face mz-front" style="background: var(--accent-bg); justify-content: flex-end;"><span class="mz-pill" style="width: 56px;"></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">Y</span>youtube.com</span><span class="mz-title">Signal Forms in 20 minutes</span><span class="mz-note">Watch on the weekend</span></span>
<span class="mz-ring" style="--n: 2;"></span>
</button></div></div>
<div class="mz-tile {{p1}}" style="--i: 1; --d: 1.1;"><div class="mz-px"><button type="button" class="mz-inner {{f1}}" onClick="{{flip1}}" aria-label="Wool coat, straight cut, graphite, cos.com">
<span class="mz-face mz-front" style="background: var(--primary); justify-content: flex-start;"><span class="mz-sq"></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">C</span>cos.com</span><span class="mz-title">Wool coat, straight cut, graphite</span><span class="mz-note">Wait for the sale</span></span>
<span class="mz-ring" style="--n: 5;"></span>
</button></div></div>
<div class="mz-tile {{p2}}" style="--i: 2; --d: 0.8;"><div class="mz-px"><button type="button" class="mz-inner {{f2}}" onClick="{{flip2}}" aria-label="NestJS for frontend developers, stepik.org">
<span class="mz-face mz-front" style="background: var(--accent); justify-content: flex-end;"></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">S</span>stepik.org</span><span class="mz-title">NestJS for frontend developers</span><span class="mz-note">For the side project</span></span>
<span class="mz-ring" style="--n: 0;"></span>
</button></div></div>
<div class="mz-tile {{p3}}" style="--i: 3; --d: 1.2;"><div class="mz-px"><button type="button" class="mz-inner {{f3}}" onClick="{{flip3}}" aria-label="The best weeknight ramen, seriouseats.com">
<span class="mz-face mz-front" style="background: var(--accent); justify-content: flex-start;"><span class="mz-sq"></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">R</span>seriouseats.com</span><span class="mz-title">The best weeknight ramen</span><span class="mz-note">Friday dinner</span></span>
<span class="mz-ring" style="--n: 7;"></span>
</button></div></div>
<div class="mz-tile {{p4}}" style="--i: 4; --d: 0.5;"><div class="mz-px"><button type="button" class="mz-inner {{f4}}" onClick="{{flip4}}" aria-label="Zoneless change detection, explained, angular.dev">
<span class="mz-face mz-front" style="background: var(--accent-bg); justify-content: flex-end;"><span style="display: flex; gap: 8px;"><span class="mz-pill" style="width: 64px;"></span><span class="mz-pill" style="width: 48px;"></span></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">A</span>angular.dev</span><span class="mz-title">Zoneless change detection, explained</span><span class="mz-note">Read before stage 0</span></span>
<span class="mz-ring" style="--n: 3;"></span>
</button></div></div>
<div class="mz-tile {{p5}}" style="--i: 5; --d: 0.9;"><div class="mz-px"><button type="button" class="mz-inner {{f5}}" onClick="{{flip5}}" aria-label="Lisbon in three days, cntraveler.com">
<span class="mz-face mz-front" style="background: var(--primary); justify-content: flex-start;"><span class="mz-sq"></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">L</span>cntraveler.com</span><span class="mz-title">Lisbon in three days</span><span class="mz-note">Maybe in May</span></span>
<span class="mz-ring" style="--n: 6;"></span>
</button></div></div>
<div class="mz-tile {{p6}}" style="--i: 6; --d: 0.7;"><div class="mz-px"><button type="button" class="mz-inner {{f6}}" onClick="{{flip6}}" aria-label="Icons for the side project, tabler.io">
<span class="mz-face mz-front" style="background: var(--accent-bg); justify-content: flex-end;"><span class="mz-pill" style="width: 56px;"></span></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">T</span>tabler.io</span><span class="mz-title">Icons for the side project</span><span class="mz-note">Compare with our own set</span></span>
<span class="mz-ring" style="--n: 1;"></span>
</button></div></div>
<div class="mz-tile {{p7}}" style="--i: 7; --d: 1.0;"><div class="mz-px"><button type="button" class="mz-inner {{f7}}" onClick="{{flip7}}" aria-label="The two Reacts, overreacted.io">
<span class="mz-face mz-front" style="background: var(--text-muted); justify-content: flex-end;"></span>
<span class="mz-face mz-back"><span class="sm-card__meta"><span class="sm-favicon">O</span>overreacted.io</span><span class="mz-title">The two Reacts</span><span class="mz-note">Read this one day</span></span>
<span class="mz-ring" style="--n: 4;"></span>
</button></div></div>
</div></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  tick() {
    const s = this.state || {};
    if (this._hover || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const slots = (s.slots || ['a','b','c','d','e','f','g','h']).slice();
    const swaps = [[4,0],[2,6],[4,7],[1,3],[4,2],[5,7],[4,1],[0,6]];
    const k = (s.step || 0) % swaps.length;
    const wideAt = slots.indexOf('e');
    const [x, y] = swaps[k];
    const a = x === 4 ? wideAt : x; let b = y === wideAt ? (y + 1) % 8 : y; if (a === b) b = (b + 1) % 8;
    [slots[a], slots[b]] = [slots[b], slots[a]];
    this.setState({ slots, step: k + 1 });
  }
  renderVals() {
    const s = this.state || {};
    if (!this._timer) this._timer = setInterval(() => this.tick(), 4500);
    const slots = s.slots || ['a','b','c','d','e','f','g','h'];
    const v = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    for (let i = 0; i < 8; i++) {
      v['p' + i] = 'slot-' + slots[i];
      v['f' + i] = s['f' + i] ? 'is-flipped' : '';
      v['flip' + i] = () => this.setState({ ['f' + i]: !s['f' + i] });
    }
    v.tilt = (e) => {
      this._hover = true;
      const el = e.currentTarget, r = el.getBoundingClientRect();
      el.style.setProperty('--px', (((e.clientX - r.left) / r.width) - 0.5).toFixed(3));
      el.style.setProperty('--py', (((e.clientY - r.top) / r.height) - 0.5).toFixed(3));
    };
    v.untilt = (e) => { this._hover = false; e.currentTarget.style.setProperty('--px', 0); e.currentTarget.style.setProperty('--py', 0); };
    return v;
  }
}
</script>
</body>
</html>
