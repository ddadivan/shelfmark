<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Quick save from the share menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../reference.css">
<link rel="stylesheet" href="boards.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" class="sm-root dir-a" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: Onest, system-ui, sans-serif;">
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 72px 20px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-hover);">
<div style="align-self: flex-start; max-width: 260px; padding: 10px 12px; border-radius: 16px 16px 16px 4px; background: var(--surface); font-size: 14px; line-height: 20px;">look at this coat cos.com/en/wool-coat</div>
<div style="align-self: flex-end; max-width: 200px; padding: 10px 12px; border-radius: 16px 16px 4px 16px; background: var(--accent-bg); color: var(--accent-text); font-size: 14px;">saving it</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

<form class="sm-sheet" role="dialog" aria-modal="true" aria-labelledby="st-t" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; gap: 14px;">
<div class="sm-sheet__grip" aria-hidden="true"></div>
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" style="fill: var(--primary)"/><path d="M19 5h6v11l-3-2.4-3 2.4z" style="fill: var(--logo-bookmark)"/></svg>
<div style="flex: 1;"><h2 id="st-t" style="margin: 0; font-size: 18px; font-weight: 600;">Save to Shelfmark</h2><div style="font-size: 12px; color: var(--text-muted);">Shared from another app</div></div>
</div>
<div style="display: flex; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg);">
<div style="width: 88px; flex: none; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); background: var(--accent-bg);"></div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;"><div class="sm-card__meta"><span class="sm-favicon">C</span>cos.com</div><div style="font-size: 14px; line-height: 20px; font-weight: 600;">Wool coat, straight cut, graphite</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span class="sm-field__label">Folder</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap;"><button type="button" class="sm-chip sm-chip--clickable" style="height: 36px; padding: 0 14px; background: var(--primary); color: var(--on-primary);">Clothes</button><button type="button" class="sm-chip sm-chip--clickable sm-chip--neutral" style="height: 36px; padding: 0 14px;">Unsorted</button><button type="button" class="sm-chip sm-chip--clickable sm-chip--neutral" style="height: 36px; padding: 0 14px;">Work</button><button type="button" class="sm-chip sm-chip--clickable sm-chip--neutral" style="height: 36px; padding: 0 14px;">More…</button></div>
</div>
<div class="sm-field"><label class="sm-field__label" for="st-n">Note</label><div class="sm-field__control" style="min-height: 48px;"><input id="st-n" placeholder="Why are you saving this?"></div></div>
<button type="submit" class="sm-btn sm-btn--primary sm-btn--lg" style="width: 100%; height: 48px;">Save</button>
<p style="margin: 0; text-align: center; font-size: 12px; color: var(--text-muted);">Recent folders come first. After saving you're back in your app.</p>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
