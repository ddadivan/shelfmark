document.querySelectorAll('.mz-inner').forEach(function(b){b.addEventListener('click',function(){b.classList.toggle('is-flipped');});});
var swaps=[[4,0],[2,6],[4,7],[1,3],[4,2],[5,7],[4,1],[0,6]];
setInterval(function(){if(hover||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var k=step%swaps.length,w=slots.indexOf('e'),x=swaps[k][0],y=swaps[k][1],a=x===4?w:x,b=y===w?(y+1)%8:y;if(a===b)b=(b+1)%8;var t=slots[a];slots[a]=slots[b];slots[b]=t;step++;tiles.forEach(function(el,i){el.className='mz-tile slot-'+slots[i];});},4500);
document.addEventListener('keydown',function(e){if(e.key==='d'){var r=document.getElementById('root');r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';}});
</script></body></html>
