<div class="ext-screen__head">
  <ui-logo />
</div>

<div class="ext-screen__center signin">
  <ui-illustration class="signin__scene" name="welcome-collect" motion="once" />
  <h1 class="ext-screen__center-title">{{ 'popup.signedOut.title' | transloco }}</h1>
  <p class="ext-screen__text">{{ 'popup.signedOut.text' | transloco }}</p>
  <p class="signin__privacy">
    {{ 'popup.signedOut.privacy' | transloco }}
    <ui-button size="sm" [variant]="BUTTON_VARIANT.Ghost" (click)="store.openPrivacy()">{{
      'popup.signedOut.privacyLink' | transloco
    }}</ui-button>
  </p>
</div>

<div class="ext-screen__foot">
  <ui-button [variant]="BUTTON_VARIANT.Primary" (click)="store.openSignIn()">{{
    'popup.signedOut.signIn' | transloco
  }}</ui-button>
</div>
