<div class="ext-screen__head">
  <ui-logo />
</div>
<div class="ext-screen__center">
  <ui-illustration motion="once" [name]="illustration()" />
  <h1 class="ext-screen__center-title">{{ titleKey() | transloco }}</h1>
  <p class="ext-screen__text" [attr.role]="unsupported() ? null : 'alert'">
    {{ textKey() | transloco }}
  </p>
</div>
@if (!unsupported() && store.page(); as page) {
  <div class="ext-preview">
    <span class="ext-preview__thumb" aria-hidden="true"></span>
    <span class="ext-preview__text">
      <span class="ext-preview__host">{{ page.host }}</span>
      <span class="ext-preview__title">{{ page.title }}</span>
    </span>
  </div>
}
<div class="ext-screen__foot">
  <ui-button (click)="store.openApp()">{{ 'popup.openApp' | transloco }}</ui-button>
  @if (canRetry()) {
    <span class="ext-foot-slot" [class.ext-foot-slot--animate]="animateSlot">
      <ui-button [variant]="BUTTON_VARIANT.Primary" (click)="store.retry()">{{
        'popup.error.tryAgain' | transloco
      }}</ui-button>
    </span>
  }
</div>
