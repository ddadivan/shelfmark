<!-- Shelf 07-extension: the link as a row, its picture in the thumb, then title and site. -->
<ui-list-item [thumb]="image() ?? ''" (activated)="activated.emit()">
  <span slot="title">{{ link().title }}</span>
  <span slot="meta" class="card__site">
    <ui-favicon [src]="favicon()" [letter]="letter()" />
    <span class="card__host">{{ host() }}</span>
  </span>
</ui-list-item>
