    <link rel="manifest" href="manifest.webmanifest" />
    <!-- theme-color copies the --bg token (libs/ui tokens/_light.scss, _dark.scss); a spec checks it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- App skeleton (#410): an overlay for a signed-in start, shown by public/boot-skeleton.js and

            <span class="boot__block boot__avatar"></span>

            <span class="boot__block boot__count"></span>
            <!-- The extension banner (#490): only with html[data-boot-extension]. -->
            <span class="boot__extension"></span>
