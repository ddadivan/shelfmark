<div class="score-scale__buttons">
  @for (score of scores; track score) {
    <ui-button
      class="score-scale__button"
      block
      [size]="phone() ? BUTTON_SIZE.Lg : BUTTON_SIZE.Md"
      [tabIndex]="tabStop() === score ? 0 : -1"
      [ariaLabel]="'rating.scale.score' | transloco: { score: score }"
      (click)="picked.emit(score)"
      (focusin)="tabStop.set(score)"
    >
      {{ score }}
    </ui-button>
  }
</div>
<div class="score-scale__edges" aria-hidden="true">
  <span>{{ 'rating.scale.low' | transloco }}</span>
  <span>{{ 'rating.scale.high' | transloco }}</span>
</div>
