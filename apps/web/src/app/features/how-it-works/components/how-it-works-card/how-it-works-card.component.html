<section class="how-it-works-card" [attr.aria-label]="'howItWorks.card.label' | transloco">
  <ui-button
    class="how-it-works-card__open"
    variant="ghost"
    size="sm"
    wrap
    (click)="howItWorks.open()"
  >
    {{ 'howItWorks.card.title' | transloco }}
  </ui-button>
  <span class="how-it-works-card__meta">
    <ui-icon class="how-it-works-card__icon" name="play" [size]="ICON_SIZE.Sm" />
    {{ 'howItWorks.card.length' | transloco }}
  </span>
  <ui-button
    class="how-it-works-card__hide"
    variant="ghost"
    size="sm"
    iconOnly
    iconLeft="close"
    [ariaLabel]="'howItWorks.card.hide' | transloco"
    (click)="howItWorks.hideCard()"
  />
</section>
