<section class="landing-why" appLandingReveal aria-labelledby="landing-why-title">
  <h2 id="landing-why-title" class="landing-why__title">{{ 'landing.why.title' | transloco }}</h2>
  <figure class="landing-why__figure">
    <blockquote class="landing-why__quote">
      <p>{{ 'landing.why.quote' | transloco }}</p>
    </blockquote>
    <figcaption class="landing-why__author">
      <ui-avatar [size]="AVATAR_SIZE.Lg" [name]="'landing.why.authorName' | transloco" />
      <span class="landing-why__who">
        <span class="landing-why__name">{{ 'landing.why.author' | transloco }}</span>
        <span class="landing-why__role">{{ 'landing.why.role' | transloco }}</span>
      </span>
    </figcaption>
  </figure>
</section>
