<section class="landing-whats-new" id="changelog" aria-labelledby="landing-whats-new-title">
  <h2 id="landing-whats-new-title" class="landing-whats-new__title">
    {{ 'landing.whatsNew.title' | transloco }}
  </h2>
  <ul class="landing-whats-new__list" appLandingReveal>
    @for (entry of highlights; track entry.item.id) {
      <li class="landing-whats-new__item">
        <time class="landing-whats-new__date" [attr.datetime]="entry.date">{{
          entry.date | appDate
        }}</time>
        <h3 class="landing-whats-new__name">{{ entry.item.titleKey | transloco }}</h3>
        <p class="landing-whats-new__lead">{{ entry.item.textKey | transloco }}</p>
      </li>
    }
  </ul>
  <p class="landing-whats-new__all">
    <a [routerLink]="changelogHref">{{ 'landing.whatsNew.all' | transloco }}</a>
  </p>
</section>
