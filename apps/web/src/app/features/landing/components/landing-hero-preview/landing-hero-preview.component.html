<!--
  A picture of the app, not the app: decorative, so hidden from assistive technology and inert
  (the cards' own title buttons must not be tab stops).
-->
<div
  class="landing-hero-preview"
  aria-hidden="true"
  inert
  [class.landing-hero-preview--waiting]="waiting()"
  [class.landing-hero-preview--playing]="playing()"
>
  <div class="landing-hero-preview__panel">
    <div class="landing-hero-preview__head">
      <span class="landing-hero-preview__folder">{{
        'landing.hero.preview.folder' | transloco
      }}</span>
      <span class="landing-hero-preview__count">{{
        'landing.hero.preview.count' | transloco
      }}</span>
      <ui-segmented-control
        class="landing-hero-preview__switch"
        [options]="options()"
        value="all"
        [ariaLabel]="'landing.hero.preview.view' | transloco"
      />
    </div>
    <div class="landing-hero-preview__grid">
      @for (card of cards; track card.id; let index = $index) {
        <div class="landing-hero-preview__item" [style.--landing-preview-index]="index">
          <app-link-preview-card
            [title]="'landing.hero.preview.items.' + card.id + '.title' | transloco"
            [host]="card.host"
            [daysAgo]="card.daysAgo"
            [tone]="card.tone"
            [tags]="['landing.hero.preview.items.' + card.id + '.tag' | transloco]"
          />
        </div>
      }
    </div>
  </div>
  <ui-toast
    class="landing-hero-preview__toast"
    [style.--landing-preview-index]="cards.length"
    [kind]="TOAST_KIND.Saved"
    [title]="'landing.hero.preview.savedTo' | transloco: { folder: folder() }"
    [actionLabel]="'landing.hero.preview.undo' | transloco"
  />
</div>
