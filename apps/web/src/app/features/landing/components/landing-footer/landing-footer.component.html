<footer class="landing-footer">
  <span>{{ 'landing.footer.copyright' | transloco }}</span>
  <span class="landing-footer__links">
    <a class="landing-footer__link" [routerLink]="LANDING_LINKS.Privacy">{{
      'landing.footer.privacy' | transloco
    }}</a>
    <a
      class="landing-footer__link"
      [attr.href]="LANDING_LINKS.Repository"
      target="_blank"
      rel="noopener noreferrer"
      >{{ 'landing.footer.github' | transloco
      }}<span class="landing-footer__hint"> ({{ 'landing.newTab' | transloco }})</span></a
    >
  </span>
  <div
    class="landing-footer__languages"
    role="group"
    [attr.aria-label]="'landing.footer.language' | transloco"
  >
    @for (item of languages; track item.lang) {
      <ui-button
        [variant]="BUTTON_VARIANT.Ghost"
        [size]="BUTTON_SIZE.Sm"
        [attr.lang]="item.lang"
        [ariaPressed]="locale.lang() === item.lang"
        (click)="choose(item.lang)"
        >{{ item.name }}</ui-button
      >
    }
  </div>
</footer>
