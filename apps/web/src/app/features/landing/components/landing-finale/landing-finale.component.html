<section class="landing-finale" aria-labelledby="landing-finale-title">
  <div class="landing-finale__reveal" appLandingReveal>
    <div class="landing-finale__card">
      <h2 id="landing-finale-title" class="landing-finale__title">
        {{ 'landing.finale.title' | transloco }}
      </h2>
      <p class="landing-finale__lead">{{ 'landing.finale.lead' | transloco }}</p>
      <div class="landing-finale__actions">
        @if (signedIn()) {
          <ui-button
            [variant]="BUTTON_VARIANT.Primary"
            [size]="BUTTON_SIZE.Lg"
            [href]="LANDING_LINKS.Shelf"
            [appAppLink]="LANDING_LINKS.Shelf"
            >{{ 'landing.backToShelf' | transloco }}</ui-button
          >
        } @else {
          <ui-button
            class="landing-finale__glow"
            [variant]="BUTTON_VARIANT.Primary"
            [size]="BUTTON_SIZE.Lg"
            [href]="LANDING_LINKS.Demo"
            [appAppLink]="LANDING_LINKS.Demo"
            >{{ 'landing.finale.demo' | transloco }}</ui-button
          >
          <ui-button
            [size]="BUTTON_SIZE.Lg"
            [href]="LANDING_LINKS.SignIn"
            [appAppLink]="LANDING_LINKS.SignIn"
            >{{ 'landing.finale.signIn' | transloco }}</ui-button
          >
        }
      </div>
    </div>
  </div>
</section>
