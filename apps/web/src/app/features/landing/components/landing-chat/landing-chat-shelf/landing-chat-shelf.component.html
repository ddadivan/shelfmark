<ul class="landing-chat-shelf__list">
  @for (group of groups; track group.id) {
    @let groupIndex = $index;
    <li
      class="landing-chat-shelf__group"
      [style.animation-delay.ms]="groupIndex * timing.GroupStaggerMs"
    >
      <p class="landing-chat-shelf__folder">{{ group.folderKey | transloco }}</p>
      <ul class="landing-chat-shelf__cards">
        @for (link of group.links; track link.id) {
          <li
            class="landing-chat-shelf__card"
            data-testid="landing-chat-shelf-card"
            [style.animation-delay.ms]="
              groupIndex * timing.GroupStaggerMs + $index * timing.CardStaggerMs
            "
          >
            <ui-favicon [letter]="link.letter" />
            <span class="landing-chat-shelf__card-text">
              <span class="landing-chat-shelf__card-title">{{ link.titleKey | transloco }}</span>
              <span class="landing-chat-shelf__card-note">{{ link.noteKey | transloco }}</span>
            </span>
          </li>
        }
      </ul>
    </li>
  }
</ul>
