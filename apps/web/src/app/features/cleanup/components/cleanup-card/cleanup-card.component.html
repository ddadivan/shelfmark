@if (store.show()) {
  <ui-panel class="cleanup-card">
    <section class="cleanup-card__inner" [attr.aria-label]="'cleanup.card.label' | transloco">
      <span class="cleanup-card__icon" aria-hidden="true">
        <ui-icon name="copy" [size]="ICON_SIZE.Md" />
      </span>
      <div class="cleanup-card__text">
        <h2 class="cleanup-card__title">{{ 'cleanup.card.title' | transloco }}</h2>
        <p class="cleanup-card__lead">{{ 'cleanup.card.text' | transloco: { items: items() } }}</p>
      </div>
      <div class="cleanup-card__actions">
        <ui-button variant="secondary" size="sm" [href]="href" (linkClick)="review($event)">
          {{ 'cleanup.card.review' | transloco }}
        </ui-button>
        <ui-button
          variant="ghost"
          size="sm"
          iconOnly
          iconLeft="close"
          [ariaLabel]="'cleanup.card.dismiss' | transloco"
          (click)="store.dismiss()"
        />
      </div>
    </section>
  </ui-panel>
}
