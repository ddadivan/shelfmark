<ui-checkbox
  class="cleanup-row__check"
  [label]="'cleanup.tagPair.title' | transloco: { keep: row().keep.name, merge: row().merge.name }"
  [hint]="detail()"
  [checked]="row().selected"
  (checkedChange)="toggled.emit($event)"
/>
@if (row().ai) {
  <ui-badge class="cleanup-row__badge" icon="spark" [uiTooltip]="'ai.disclaimer' | transloco">{{
    'cleanup.foundByAi' | transloco
  }}</ui-badge>
}
<ui-button class="cleanup-row__swap" variant="ghost" size="sm" wrap (click)="swapped.emit()">
  {{ 'cleanup.tagPair.swap' | transloco: { merge: row().merge.name } }}
</ui-button>
