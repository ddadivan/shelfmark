<ui-dialog
  class="search-dialog"
  phoneFullscreen
  [title]="(asking() ? 'ai.ask.title' : 'search.title') | transloco"
  [closeLabel]="'search.close' | transloco"
>
  @if (segmented()) {
    <ui-segmented-control
      class="search-dialog__modes"
      [options]="options()"
      [value]="mode()"
      [ariaLabel]="'search.mode.label' | transloco"
      (valueChange)="setMode($event)"
    />
  }
  @if (asking()) {
    <div class="search-dialog__ask">
      <app-ask-composer />
      <app-ask-conversation />
    </div>
  } @else {
    <app-search-results (done)="close()" (ask)="ask($event)" />
  }
</ui-dialog>
