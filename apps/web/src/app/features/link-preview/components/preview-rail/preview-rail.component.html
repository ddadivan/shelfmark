<nav class="preview-rail" [attr.aria-label]="'preview.rail.label' | transloco">
  <a class="preview-rail__item preview-rail__logo" [routerLink]="HOME">
    <ui-logo [variant]="LOGO_VARIANT.Mark" [label]="'preview.rail.home' | transloco" />
  </a>
  @for (entry of ENTRIES; track entry.path) {
    <a
      class="preview-rail__item"
      [routerLink]="entry.path"
      [class.preview-rail__item--current]="isCurrent(entry.path)"
      [attr.aria-current]="isCurrent(entry.path) ? 'page' : null"
      [attr.aria-label]="entry.labelKey | transloco"
      [uiTooltip]="entry.labelKey | transloco"
    >
      <ui-icon [name]="entry.icon" [size]="20" />
    </a>
  }
  @if (roots().length > 0) {
    <span class="preview-rail__sep" aria-hidden="true"></span>
    <div class="preview-rail__folders">
      @for (folder of roots(); track folder.id) {
        <a
          class="preview-rail__item"
          [routerLink]="folderPath(folder.id)"
          [class.preview-rail__item--current]="isCurrent(folderPath(folder.id))"
          [attr.aria-current]="isCurrent(folderPath(folder.id)) ? 'page' : null"
          [attr.aria-label]="'preview.rail.folder' | transloco: { name: folder.name }"
          [uiTooltip]="folder.name"
        >
          <ui-folder-icon
            [size]="FOLDER_ICON_SIZE.Sm"
            [icon]="folder.icon"
            [colour]="settings.shownColour(folder.colour)"
          />
        </a>
      }
    </div>
  }
  <span class="preview-rail__spacer"></span>
  <ui-button
    variant="ghost"
    iconOnly
    iconLeft="sidebar"
    [ariaLabel]="'preview.rail.showSidebar' | transloco"
    [uiTooltip]="'preview.rail.showSidebar' | transloco"
    (click)="route.showSidebar()"
  />
</nav>
