<section
  class="preview-panel"
  [attr.aria-label]="'preview.region' | transloco: { title: preview.link()?.title ?? '' }"
>
  <div
    class="preview-panel__bar"
    role="toolbar"
    uiTooltipGroup
    [attr.aria-label]="'preview.toolbar' | transloco"
  >
    <ui-button
      variant="ghost"
      size="sm"
      iconOnly
      iconLeft="chevron-up"
      [disabled]="preview.previousId() === null"
      [ariaLabel]="'preview.previous' | transloco"
      [uiTooltip]="'preview.previous' | transloco"
      uiTooltipShortcut="↑"
      (click)="preview.go(-1)"
    />
    <ui-button
      variant="ghost"
      size="sm"
      iconOnly
      iconLeft="chevron-down"
      [disabled]="preview.nextId() === null"
      [ariaLabel]="'preview.next' | transloco"
      [uiTooltip]="'preview.next' | transloco"
      uiTooltipShortcut="↓"
      (click)="preview.go(1)"
    />
    @if (preview.link(); as link) {
      <div class="preview-panel__title">
        <!-- prettier-ignore -->
        <h2 class="preview-panel__name">{{ link.title }}</h2>
        <span class="preview-panel__address">
          <ui-favicon [src]="favicon()" [letter]="letter()" [colour]="colour()" />
          <span class="preview-panel__url">{{ address() }}</span>
        </span>
      </div>
      <div class="preview-panel__tools">
        <app-related-links small [linkId]="link.id" (chosen)="preview.open($event)" />
        <ui-segmented-control
          class="preview-panel__mode"
          [ariaLabel]="'preview.mode.label' | transloco"
          [options]="modes()"
          [value]="reader.mode()"
          (valueChange)="setMode($event)"
        />
        @if (reader.reading()) {
          <ui-button
            variant="ghost"
            size="sm"
            iconOnly
            iconLeft="text-size"
            [ariaLabel]="'preview.reading.title' | transloco"
            [uiPopoverTrigger]="readingSettings.popover()"
            uiPopoverTriggerHover="false"
          />
        }
        @if (preview.href()) {
          <ui-button
            variant="secondary"
            size="sm"
            iconLeft="external"
            [uiTooltip]="'preview.openHint' | transloco"
            uiTooltipShortcut="↵"
            (click)="preview.openInNewTab()"
          >
            {{ 'preview.open' | transloco }}
          </ui-button>
        }
        <ui-button
          class="preview-panel__star"
          [class.preview-panel__star--on]="link.isFavorite"
          variant="ghost"
          size="sm"
          iconOnly
          [iconLeft]="link.isFavorite ? 'star-filled' : 'star'"
          [ariaPressed]="link.isFavorite"
          [ariaLabel]="'preview.favorite' | transloco"
          [uiTooltip]="
            (link.isFavorite ? 'links.item.removeFavorite' : 'links.item.addFavorite') | transloco
          "
          (click)="preview.toggleFavorite()"
        />
        <ui-button
          variant="ghost"
          size="sm"
          iconOnly
          iconLeft="panel-right"
          [ariaPressed]="reader.detailsOpen()"
          [ariaLabel]="'preview.details.toggle' | transloco"
          (click)="reader.toggleDetails()"
        />
        <ui-button
          variant="ghost"
          size="sm"
          iconOnly
          iconLeft="more"
          [ariaLabel]="'preview.more' | transloco"
          [uiMenuTrigger]="more.menu()"
        />
      </div>
    } @else {
      <span class="preview-panel__title"></span>
    }
    <span class="preview-panel__sep" aria-hidden="true"></span>
    <ui-button
      variant="ghost"
      size="sm"
      iconOnly
      iconLeft="close"
      [ariaLabel]="'preview.close' | transloco"
      [uiTooltip]="'preview.close' | transloco"
      uiTooltipShortcut="Esc"
      (click)="preview.close()"
    />
  </div>
  <div class="preview-panel__main" [class.preview-panel__main--details]="reader.detailsOpen()">
    @if (reader.reading()) {
      <app-preview-reader class="preview-panel__body" />
    } @else {
      <app-preview-body class="preview-panel__body" />
    }
    @if (reader.detailsOpen() && preview.link(); as link) {
      <app-preview-details class="preview-panel__details" [link]="link" />
    }
  </div>
</section>
<app-preview-menu #more wide />
<app-reading-settings #readingSettings />
