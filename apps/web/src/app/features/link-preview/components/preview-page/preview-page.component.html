<section
  class="preview-page"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'preview.region' | transloco: { title: preview.link()?.title ?? '' }"
>
  <header class="preview-page__head">
    <ui-button
      variant="ghost"
      iconOnly
      iconLeft="chevron-left"
      [iconSize]="ICON_SIZE.Lg"
      [ariaLabel]="'preview.back' | transloco"
      (click)="preview.close()"
    />
    <div class="preview-page__title">
      <!-- prettier-ignore -->
      <h1 class="preview-page__name">{{ preview.link()?.title }}</h1>
      @if (preview.link()) {
        <span class="preview-page__domain">
          <ui-favicon [src]="favicon()" [letter]="letter()" />
          <span class="preview-page__host">{{ domain() }}</span>
        </span>
      }
    </div>
    @if (preview.href()) {
      <ui-button
        variant="ghost"
        iconOnly
        iconLeft="external"
        [ariaLabel]="'preview.openInBrowser' | transloco"
        (click)="preview.openInNewTab()"
      />
    }
    @if (preview.link()) {
      <ui-button
        variant="ghost"
        iconOnly
        iconLeft="more"
        [uiMenuTrigger]="more.menu()"
        [ariaLabel]="'preview.more' | transloco"
      />
    }
  </header>
  @if (preview.link()) {
    <div class="preview-page__modes">
      <ui-segmented-control
        [ariaLabel]="'preview.mode.label' | transloco"
        [options]="modes()"
        [value]="reader.mode()"
        (valueChange)="setMode($event)"
      />
      @if (reader.reading()) {
        <ui-button
          variant="ghost"
          iconOnly
          iconLeft="text-size"
          [ariaLabel]="'preview.reading.title' | transloco"
          [uiPopoverTrigger]="readingSettings.popover()"
          uiPopoverTriggerHover="false"
        />
      }
      <ui-button
        class="preview-page__details-toggle"
        variant="ghost"
        iconOnly
        iconLeft="panel-right"
        [ariaPressed]="reader.detailsOpen()"
        [ariaLabel]="'preview.details.toggle' | transloco"
        (click)="reader.toggleDetails()"
      />
    </div>
  }
  <div class="preview-page__main">
    @if (reader.reading()) {
      <app-preview-reader class="preview-page__body" />
    } @else {
      <app-preview-body class="preview-page__body" />
    }
    @if (reader.detailsOpen() && preview.link(); as link) {
      <app-preview-details class="preview-page__details" [link]="link" />
    }
  </div>
  @if (preview.link(); as link) {
    <div class="preview-page__bar" role="toolbar" [attr.aria-label]="'preview.toolbar' | transloco">
      <ui-button
        class="preview-page__star"
        [class.preview-page__star--on]="link.isFavorite"
        variant="ghost"
        iconOnly
        [iconLeft]="link.isFavorite ? 'star-filled' : 'star'"
        [ariaPressed]="link.isFavorite"
        [ariaLabel]="'preview.favorite' | transloco"
        (click)="preview.toggleFavorite()"
      />
      <ui-button
        variant="ghost"
        iconOnly
        iconLeft="share"
        [ariaLabel]="'preview.share' | transloco"
        (click)="preview.share()"
      />
      <app-related-links [linkId]="link.id" (chosen)="preview.open($event)" />
    </div>
  }
</section>
<app-preview-menu #more />
<app-reading-settings #readingSettings />
