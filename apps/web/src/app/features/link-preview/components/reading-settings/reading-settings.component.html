<ui-popover class="reading-settings" [heading]="'preview.reading.title' | transloco">
  <div class="reading-settings__groups">
    <div class="reading-settings__group">
      <span class="reading-settings__label" aria-hidden="true">
        {{ 'preview.reading.size.label' | transloco }}
      </span>
      <ui-segmented-control
        [ariaLabel]="'preview.reading.size.label' | transloco"
        [options]="sizes()"
        [value]="reader.settings().size"
        (valueChange)="setSize($event)"
      />
    </div>
    <div class="reading-settings__group">
      <span class="reading-settings__label" aria-hidden="true">
        {{ 'preview.reading.font.label' | transloco }}
      </span>
      <ui-segmented-control
        [ariaLabel]="'preview.reading.font.label' | transloco"
        [options]="fonts()"
        [value]="reader.settings().font"
        (valueChange)="setFont($event)"
      />
    </div>
    <div class="reading-settings__group">
      <span class="reading-settings__label" aria-hidden="true">
        {{ 'preview.reading.width.label' | transloco }}
      </span>
      <ui-segmented-control
        [ariaLabel]="'preview.reading.width.label' | transloco"
        [options]="widths()"
        [value]="reader.settings().width"
        (valueChange)="setWidth($event)"
      />
    </div>
    <div class="reading-settings__group">
      <span class="reading-settings__label" aria-hidden="true">
        {{ 'preview.reading.tone.label' | transloco }}
      </span>
      <ui-segmented-control
        [ariaLabel]="'preview.reading.tone.label' | transloco"
        [options]="tones()"
        [value]="reader.settings().tone"
        (valueChange)="setTone($event)"
      />
    </div>
  </div>
</ui-popover>
