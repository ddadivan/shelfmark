@if (settings.askOn()) {
<div class="ask-page" [class.ask-page--chat]="chatting()">
  @if (chatting()) {
  <div class="ask-page__head">
    <ui-button
      variant="ghost"
      iconOnly
      iconLeft="chevron-left"
      [ariaLabel]="'ai.ask.back' | transloco"
      (click)="store.reset()"
    />
    <h1 class="ask-page__title">{{ store.entries()[0].question }}</h1>
  </div>
  } @else {
  <h1 class="ask-page__hidden-title">{{ 'ai.ask.title' | transloco }}</h1>
  }
  <app-ask-conversation class="ask-page__conversation" onPage />
  <div class="ask-page__bar">
    <app-ask-composer [hideFine]="viewport.phone()" />
  </div>
</div>
}
