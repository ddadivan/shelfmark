@if (settings.isOn() && count.total() > 0) {
  <ui-button
    variant="secondary"
    size="sm"
    iconLeft="spark"
    [iconSize]="ICON_SIZE.Sm"
    [href]="href"
    (linkClick)="open($event)"
  >
    {{ 'ai.tidy.entry' | transloco }}
    <ui-badge class="tidy-entry__count" pop><ui-number-flow [value]="count.total()" /></ui-badge>
  </ui-button>
} @else if (cache.reserve()) {
  <!-- The button was there last time: its slot stays until the answer is in (no shift). -->
  <ui-skeleton class="tidy-entry__slot" [shape]="SKELETON_SHAPE.Block" aria-hidden="true" />
}
