@if (rows().length > 0) {
  <ui-button
    variant="secondary"
    iconLeft="spark"
    [size]="size()"
    [uiPopoverTrigger]="popover"
    uiPopoverTriggerHover="false"
  >
    {{ 'ai.related.button' | transloco: { count: rows().length } }}
  </ui-button>
  <ui-popover #popover class="related-links__popover" [heading]="'ai.related.title' | transloco">
    <ul class="related-links__list">
      @for (row of rows(); track row.link.id) {
        <li>
          <ui-list-item compact (activated)="choose(row.link, popover)">
            <ui-favicon
              slot="leading"
              [src]="row.link.faviconUrl ?? undefined"
              [letter]="row.letter"
            />
            <span slot="title">{{ row.link.title }}</span>
            <span slot="meta" class="related-links__why">
              @if (row.reasons) {
                <ui-icon
                  class="related-links__spark"
                  name="spark"
                  [size]="ICON_SIZE.Sm"
                  [label]="'ai.disclaimer' | transloco"
                  [attr.title]="'ai.disclaimer' | transloco"
                />{{ 'ai.related.why' | transloco: { reasons: row.reasons } }}
              } @else {
                {{ row.host }}
              }
            </span>
          </ui-list-item>
        </li>
      }
    </ul>
  </ui-popover>
}
