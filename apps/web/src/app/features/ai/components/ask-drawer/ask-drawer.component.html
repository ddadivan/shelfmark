<ui-drawer
  [closeLabel]="'ai.ask.close' | transloco"
  [side]="DRAWER_SIDE.End"
  [width]="DRAWER_WIDTH.Wide"
  resizable
  [resizeLabel]="'ai.ask.resize' | transloco"
  [size]="width.width()"
  (sizeChange)="width.set($event)"
>
  <div slot="head" class="ask-drawer__head">
    @if (store.entries().length > 0) {
      <ui-button variant="secondary" size="sm" iconLeft="add" (click)="startOver()">
        {{ 'ai.ask.newChat' | transloco }}
      </ui-button>
    }
    <ui-button
      class="ask-drawer__page"
      variant="ghost"
      size="sm"
      iconOnly
      iconLeft="expand"
      [ariaLabel]="'ai.ask.history.openPage' | transloco"
      (click)="openPage()"
    />
  </div>
  <app-ask-conversation />
  <app-ask-composer slot="foot" />
</ui-drawer>
