<span class="ask-heading__tile" aria-hidden="true">
  <ui-icon name="spark" [size]="ICON_SIZE.Lg" />
</span>
<span class="ask-heading__text">
  @if (onPage()) {
    <h1 class="ask-heading__title">{{ 'ai.ask.title' | transloco }}</h1>
  } @else {
    <h2 class="ask-heading__title">{{ 'ai.ask.title' | transloco }}</h2>
  }
  @if (left(); as left) {
    <span class="ask-heading__left">{{ left.key | transloco: { count: left.count } }}</span>
  }
</span>
