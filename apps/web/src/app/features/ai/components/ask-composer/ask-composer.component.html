<form class="ask-composer__form" (submit)="send($event)">
  <ui-textarea
    class="ask-composer__field"
    labelHidden
    [rows]="1"
    [maxRows]="5"
    [label]="'ai.ask.label' | transloco"
    [placeholder]="'ai.ask.placeholder' | transloco"
    [disabled]="store.streaming() || limited()"
    [(value)]="text"
    (keydown.enter)="onEnter($event)"
  >
    <span slot="end" class="ask-composer__end">
      @if (store.streaming()) {
        <ui-button variant="secondary" size="sm" (click)="store.stop()">{{
          'ai.ask.stop' | transloco
        }}</ui-button>
      } @else {
        <ui-button
          type="submit"
          variant="ai"
          iconOnly
          iconLeft="arrow-up"
          [class.ask-composer__send--ready]="canSend()"
          [ariaLabel]="'ai.ask.send' | transloco"
          [disabled]="!canSend()"
        />
      }
    </span>
  </ui-textarea>
</form>
<p class="ask-composer__footer">{{ 'ai.ask.footer' | transloco }}</p>
