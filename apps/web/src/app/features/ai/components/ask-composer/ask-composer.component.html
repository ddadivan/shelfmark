@if (!limited()) {
  <form class="ask-composer__form" (submit)="send($event)">
    <ui-textarea
      class="ask-composer__field"
      labelHidden
      [rows]="1"
      [maxRows]="5"
      [label]="'ai.ask.label' | transloco"
      [placeholder]="(store.answered() ? 'ai.ask.followUp' : 'ai.ask.placeholder') | transloco"
      [disabled]="store.streaming()"
      [(value)]="text"
      (keydown.enter)="onEnter($event)"
    >
      <span slot="end" class="ask-composer__end">
        @if (store.streaming()) {
          <ui-button variant="secondary" (click)="store.stop()">{{
            'ai.ask.stop' | transloco
          }}</ui-button>
        } @else {
          <ui-button
            type="submit"
            variant="primary"
            iconOnly
            iconLeft="chevron-up"
            [ariaLabel]="'ai.ask.send' | transloco"
          />
        }
      </span>
    </ui-textarea>
  </form>
}
@if (!hideFine()) {
  <p class="ask-composer__footer">
    {{ 'ai.ask.fine' | transloco }}
    @if (left(); as left) {
      {{ left.key | transloco: { count: left.count } }}.
    }
  </p>
}
