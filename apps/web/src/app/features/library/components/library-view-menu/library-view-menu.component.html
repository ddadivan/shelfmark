<ui-view-menu
  [label]="'library.viewMenu.view' | transloco"
  [heading]="'library.viewMenu.gridSize' | transloco"
  [steps]="steps"
  [step]="filters.gridStep()"
  [stepText]="stepText"
  [smallLabel]="'library.viewMenu.small' | transloco"
  [largeLabel]="'library.viewMenu.large' | transloco"
  [gridDisabled]="listView()"
  [gridHidden]="gridHidden()"
  [choice]="previewChoice()"
  [fields]="fields()"
  (stepChange)="setStep($event)"
  (choiceChange)="setPreview($event)"
  (fieldChange)="setField($event)"
>
  <ng-content />
</ui-view-menu>
