@if (banner.bannerShown()) {
  <section
    class="extension-banner"
    aria-labelledby="extension-banner-title"
    animate.enter="extension-banner--enter"
    animate.leave="extension-banner--leave"
  >
    <span class="extension-banner__logo" aria-hidden="true">
      <ui-logo [variant]="LOGO_VARIANT.Mark" />
    </span>
    <div class="extension-banner__copy">
      <h2 id="extension-banner-title" class="extension-banner__title">
        {{ 'library.extension.title' | transloco }}.
      </h2>
      <p class="extension-banner__text">{{ 'library.extension.text' | transloco }}</p>
    </div>
    <ui-button
      class="extension-banner__install"
      newTab
      [variant]="BUTTON_VARIANT.Primary"
      [size]="BUTTON_SIZE.Sm"
      [href]="banner.storeUrl"
      [ariaLabel]="'library.extension.installLabel' | transloco"
    >
      {{ 'library.extension.install' | transloco }}
    </ui-button>
    <ui-button
      class="extension-banner__close"
      iconOnly
      iconLeft="close"
      [variant]="BUTTON_VARIANT.Ghost"
      [size]="BUTTON_SIZE.Sm"
      [ariaLabel]="'library.extension.dismiss' | transloco"
      (click)="banner.dismiss()"
    />
  </section>
}
