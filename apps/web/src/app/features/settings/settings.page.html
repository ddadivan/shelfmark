<div class="settings">
  <ui-button
    class="settings__back"
    variant="ghost"
    size="sm"
    iconLeft="chevron-left"
    [href]="linksHref"
    (linkClick)="back($event)"
  >
    {{ 'settings.back' | transloco }}
  </ui-button>
  <h1 class="settings__title">{{ 'settings.title' | transloco }}</h1>

  @if (auth.user(); as user) {
  <app-settings-section [heading]="'settings.account.title' | transloco">
    <div class="settings__account">
      <ui-avatar [name]="user.name" [src]="user.image ?? undefined" size="lg" />
      <div class="settings__identity">
        <div class="settings__name">{{ user.name }}</div>
        <div class="settings__email">{{ user.email }}</div>
      </div>
      <ui-button
        class="settings__sign-out"
        [block]="viewport.phone()"
        [size]="viewport.phone() ? BUTTON_SIZE.Lg : BUTTON_SIZE.Md"
        (click)="signOut()"
      >
        {{ 'auth.signOut' | transloco }}
      </ui-button>
    </div>
  </app-settings-section>
  }

  <app-settings-section [heading]="'settings.data.title' | transloco">
    <app-settings-row
      [label]="'settings.data.export.label' | transloco"
      [hint]="'settings.data.export.hint' | transloco"
    >
      <div class="settings__export">
        <ui-button iconLeft="download" (click)="exportAll(EXPORT_FORMAT.Json)">
          {{ 'settings.data.export.json' | transloco }}
        </ui-button>
        <ui-button iconLeft="download" (click)="exportAll(EXPORT_FORMAT.Html)">
          {{ 'settings.data.export.html' | transloco }}
        </ui-button>
      </div>
    </app-settings-row>
  </app-settings-section>

  <app-settings-section [heading]="'settings.appearance.title' | transloco">
    <app-settings-row
      #row
      [label]="'settings.appearance.theme.label' | transloco"
      [hint]="'settings.appearance.theme.hint' | transloco"
    >
      @if (themeOptions(); as options) {
      <ui-segmented-control
        [ariaLabelledby]="row.labelId"
        [options]="options"
        [value]="theme.preference()"
        (valueChange)="setTheme($event)"
      />
      }
    </app-settings-row>
  </app-settings-section>
</div>
