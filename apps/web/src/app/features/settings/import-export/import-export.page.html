<app-settings-page-header
  [title]="'settings.nav.export' | transloco"
  [description]="'settings.description.export' | transloco"
/>

<ui-settings-section [title]="'settings.data.export.label' | transloco">
  @let json = 'settings.data.export.json' | transloco; @let html = 'settings.data.export.html' |
  transloco;
  <ui-settings-row [title]="json" [description]="'settings.data.export.jsonHint' | transloco">
    <ui-button
      iconLeft="download"
      [ariaLabel]="'settings.data.export.downloadAs' | transloco: { format: json }"
      (click)="exportAll(EXPORT_FORMAT.Json)"
    >
      {{ 'settings.data.export.download' | transloco }}
    </ui-button>
  </ui-settings-row>
  <ui-settings-row [title]="html" [description]="'settings.data.export.htmlHint' | transloco">
    <ui-button
      iconLeft="bookmark"
      [ariaLabel]="'settings.data.export.downloadAs' | transloco: { format: html }"
      (click)="exportAll(EXPORT_FORMAT.Html)"
    >
      {{ 'settings.data.export.download' | transloco }}
    </ui-button>
  </ui-settings-row>
</ui-settings-section>
