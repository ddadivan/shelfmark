<nav class="settings-nav" [attr.aria-label]="'settings.title' | transloco">
  <a
    uiRipple
    class="settings-nav__row settings-nav__back"
    [href]="linksHref"
    (click)="back($event)"
  >
    <ui-icon class="settings-nav__icon" name="chevron-left" [size]="ICON_SIZE.Sm" />
    {{ 'settings.back' | transloco }}
  </a>
  <div class="settings-nav__heading">{{ 'settings.title' | transloco }}</div>
  @for (entry of entries; track entry.path) {
    <a
      uiRipple
      class="settings-nav__row"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [routerLink]="[settingsPath, entry.path]"
    >
      <ui-icon class="settings-nav__icon" [name]="entry.icon" [size]="ICON_SIZE.Sm" />
      <span class="settings-nav__label">{{ entry.labelKey | transloco }}</span>
    </a>
  }
  <p class="settings-nav__version">
    {{ 'settings.footer.version' | transloco: { version: appVersion } }}
  </p>
</nav>
