<!-- The phone goes back to the You list; the tablet has the chip row, so only deeper pages lead back. -->
@if (viewport.phone() || (viewport.compact() && backLabel())) {
  <ui-button
    class="settings-header__back"
    variant="ghost"
    size="sm"
    iconLeft="chevron-left"
    [ariaLabel]="backLabel() ? undefined : ('settings.backToList' | transloco)"
    [href]="backHref()"
    (linkClick)="back($event)"
  >
    {{ backLabel() ?? ('settings.phoneTitle' | transloco) }}
  </ui-button>
}
<h1 class="settings-header__title">{{ title() }}</h1>
@if (description(); as text) {
  <p class="settings-header__description">{{ text }}</p>
}
