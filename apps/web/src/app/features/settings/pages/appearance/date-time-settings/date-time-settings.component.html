<ui-settings-section [title]="'settings.language.dates.title' | transloco">
  <ui-settings-row [title]="'settings.language.date.label' | transloco">
    <ui-select
      class="date-time__select"
      compact
      data-testid="date-format"
      [label]="'settings.language.date.label' | transloco"
      [options]="dateOptions()"
      [value]="language().dateFormat"
      (valueChange)="setDateFormat($event)"
    />
  </ui-settings-row>
  <ui-settings-row #timeRow [title]="'settings.language.time.label' | transloco">
    <ui-segmented-control
      [ariaLabelledby]="timeRow.titleId"
      [options]="timeOptions()"
      [value]="language().timeFormat"
      (valueChange)="setTimeFormat($event)"
    />
  </ui-settings-row>
  <ui-settings-row
    #weekRow
    [title]="'settings.language.week.label' | transloco"
    [description]="'settings.language.week.hint' | transloco"
  >
    <ui-segmented-control
      [ariaLabelledby]="weekRow.titleId"
      [options]="weekOptions()"
      [value]="language().weekStart"
      (valueChange)="setWeekStart($event)"
    />
  </ui-settings-row>
  <ui-settings-row [title]="'settings.language.preview.label' | transloco">
    <output class="date-time__preview" data-testid="language-preview" aria-live="polite">{{
      preview()
    }}</output>
  </ui-settings-row>
</ui-settings-section>
