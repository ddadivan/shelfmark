<app-settings-page-header
  [title]="'settings.nav.appearance' | transloco"
  [description]="'settings.description.appearance' | transloco"
/>

<ui-settings-section [title]="'settings.appearance.theme.label' | transloco">
  <div class="appearance__themes">
    <p class="appearance__hint">{{ 'settings.appearance.theme.hint' | transloco }}</p>
    <ui-theme-picker
      class="appearance__theme-picker"
      [ariaLabel]="'settings.appearance.theme.label' | transloco"
      [options]="themeOptions()"
      [value]="theme.preference()"
      (valueChange)="setTheme($event)"
    />
  </div>

  @if (isCustom()) {
  <div class="appearance__custom" role="group" [attr.aria-labelledby]="baseRow.titleId">
    <ui-settings-row
      #baseRow
      [title]="'settings.appearance.custom.base.label' | transloco"
      [description]="'settings.appearance.custom.base.hint' | transloco"
    >
      <ui-segmented-control
        [ariaLabelledby]="baseRow.titleId"
        [options]="baseOptions()"
        [value]="theme.customTheme().base"
        (valueChange)="setBase($event)"
      />
    </ui-settings-row>
    <ui-settings-row
      #accentRow
      [align]="SETTINGS_ROW_ALIGN.Top"
      [title]="'settings.appearance.custom.accent.label' | transloco"
      [description]="'settings.appearance.custom.accent.hint' | transloco"
    >
      <ui-theme-picker
        [kind]="THEME_PICKER_KIND.Accent"
        [ariaLabelledby]="accentRow.titleId"
        [options]="accentOptions()"
        [value]="theme.customTheme().accent"
        (valueChange)="setAccent($event)"
      />
    </ui-settings-row>
    <ui-settings-row
      #backgroundRow
      [align]="SETTINGS_ROW_ALIGN.Top"
      [title]="'settings.appearance.custom.background.label' | transloco"
      [description]="'settings.appearance.custom.background.hint' | transloco"
    >
      <ui-theme-picker
        [kind]="THEME_PICKER_KIND.Background"
        [ariaLabelledby]="backgroundRow.titleId"
        [options]="backgroundOptions()"
        [value]="theme.customTheme().background"
        (valueChange)="setBackground($event)"
      />
    </ui-settings-row>
    <ui-settings-row
      #cornersRow
      [title]="'settings.appearance.custom.corners.label' | transloco"
      [description]="'settings.appearance.custom.corners.hint' | transloco"
    >
      <ui-segmented-control
        [ariaLabelledby]="cornersRow.titleId"
        [options]="cornerOptions()"
        [value]="theme.customTheme().corners"
        (valueChange)="setCorners($event)"
      />
    </ui-settings-row>
    <div class="appearance__reset">
      <ui-button [variant]="BUTTON_VARIANT.Ghost" [size]="BUTTON_SIZE.Sm" (click)="resetCustom()">
        {{ 'settings.appearance.custom.reset' | transloco }}
      </ui-button>
    </div>
  </div>
  } @else {
  <p class="appearance__note">{{ 'settings.appearance.theme.note' | transloco }}</p>
  }
</ui-settings-section>

<ui-settings-section [title]="'settings.appearance.preview.title' | transloco">
  <div class="appearance__preview">
    <ui-theme-preview
      [ariaLabel]="'settings.appearance.preview.label' | transloco"
      [folders]="previewFolders()"
      [cards]="previewCards()"
    />
    <p class="appearance__note">{{ 'settings.appearance.preview.hint' | transloco }}</p>
  </div>
</ui-settings-section>

<ui-settings-section [title]="'settings.appearance.motion.title' | transloco">
  <ui-settings-row
    #motionRow
    [title]="'settings.appearance.motion.label' | transloco"
    [description]="'settings.appearance.motion.hint' | transloco"
  >
    <ui-segmented-control
      [ariaLabelledby]="motionRow.titleId"
      [options]="motionOptions()"
      [value]="theme.motion()"
      (valueChange)="setMotion($event)"
    />
  </ui-settings-row>
</ui-settings-section>

<ui-settings-section [title]="'settings.appearance.language.label' | transloco">
  <ui-settings-row
    [title]="'settings.appearance.language.label' | transloco"
    [description]="'settings.appearance.language.hint' | transloco"
  >
    <span class="appearance__language">{{ 'settings.appearance.language.value' | transloco }}</span>
  </ui-settings-row>
</ui-settings-section>
