<ui-panel class="topic" role="group" [attr.aria-labelledby]="'help-topic-' + category().id">
  <ui-folder-icon [icon]="category().icon" [size]="FOLDER_ICON_SIZE.Lg" />
  <h2 class="topic__title" [id]="'help-topic-' + category().id">{{ title() }}</h2>
  <p class="topic__text">{{ 'help.categories.' + category().id + '.text' | transloco }}</p>
  <ui-tree [fixedNodes]="rows()" [ariaLabel]="title()" (selected)="open($event)" />
  <span class="topic__count">{{
    countKey() | transloco: { count: category().articles.length }
  }}</span>
</ui-panel>
