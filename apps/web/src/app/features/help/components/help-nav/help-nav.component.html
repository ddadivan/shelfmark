<nav class="help-nav" [attr.aria-label]="'help.nav' | transloco">
  @for (category of categories; track category.id) {
    <div class="help-nav__group">
      <p class="help-nav__heading">{{ 'help.categories.' + category.id + '.title' | transloco }}</p>
      @for (id of category.articles; track id) {
        <a
          class="help-nav__link"
          [class.help-nav__link--on]="id === currentId()"
          [routerLink]="[helpPath, id]"
          [attr.aria-current]="id === currentId() ? 'page' : null"
          >{{ 'help.articles.' + id + '.title' | transloco }}</a
        >
      }
    </div>
  }
</nav>
