@if (fill.available()) {
  <ui-button
    class="add-link-ai-fill"
    animate.enter="add-link-ai-fill--enter"
    animate.leave="add-link-ai-fill--leave"
    variant="ai"
    iconLeft="spark"
    [block]="phone()"
    [size]="phone() ? BUTTON_SIZE.Lg : BUTTON_SIZE.Md"
    [ariaDisabled]="fill.needsLink()"
    [loading]="fill.busy()"
    [ariaDescribedby]="fill.needsLink() ? hintId : undefined"
    [uiTooltip]="tooltip()"
    [uiTooltipShortcut]="phone() || fill.needsLink() ? '' : shortcut()"
    (click)="apply()"
  >
    {{ (fill.busy() ? 'ai.fill.filling' : 'ai.fill.button') | transloco }}
  </ui-button>
}
<span class="add-link-ai-fill__live" [id]="hintId">
  @if (fill.needsLink()) {
    {{ 'ai.fill.needLink' | transloco }}
  }
</span>
<span class="add-link-ai-fill__live" aria-live="polite">{{ fill.announcement() }}</span>
