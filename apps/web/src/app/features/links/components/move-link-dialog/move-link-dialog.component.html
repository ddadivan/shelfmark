<form [formRoot]="form">
  <ui-dialog [title]="data.heading" [closeLabel]="'links.move.close' | transloco">
    <div class="move-link__fields">
      <ui-select
        [label]="'links.move.label' | transloco"
        [options]="options()"
        [emptyLabel]="'links.add.folder.unsorted' | transloco"
        [searchLabel]="'links.move.searchLabel' | transloco"
        [noResultsLabel]="'links.move.noResults' | transloco"
        searchable
        [formField]="form.folderId"
      />
    </div>

    <ui-button slot="footer" (click)="cancel()">{{ 'links.move.cancel' | transloco }}</ui-button>
    <ui-button slot="footer" [type]="BUTTON_TYPE.Submit" [variant]="BUTTON_VARIANT.Primary">{{
      'links.move.action' | transloco
    }}</ui-button>
  </ui-dialog>
</form>
