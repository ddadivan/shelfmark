<ui-history-row
  newTab
  [href]="href()"
  [preview]="preview()"
  [description]="href() ? ('links.item.opensInNewTab' | transloco) : undefined"
  (activated)="opened.emit()"
>
  <span slot="title">{{ link().title }}</span>
  <span slot="meta" class="link-history-row__folder">
    <ui-folder-icon size="sm" />
    <span class="link-history-row__folder-name">
      {{ folderName() ?? ('links.recent.unsorted' | transloco) }}
    </span>
  </span>
  <time slot="time" class="link-history-row__time" [attr.datetime]="dateTime()">{{ time() }}</time>
  <ui-button
    slot="actions"
    variant="ghost"
    size="sm"
    iconOnly
    iconLeft="close"
    [ariaLabel]="'links.recent.remove' | transloco: { title: link().title }"
    [uiTooltip]="'links.recent.removeTooltip' | transloco"
    (click)="removeRequested.emit()"
  />
</ui-history-row>
