<ui-card
  [href]="href()"
  newTab
  [reveal]="reveal()"
  [description]="href() ? ('links.item.opensInNewTab' | transloco) : undefined"
  [actionsPinned]="menu.isOpen()"
  (activated)="open()"
>
  <span slot="fallback" class="link-card__letter" aria-hidden="true">{{ letter() }}</span>
  <span slot="title">{{ link().title }}</span>
  <span slot="meta" class="link-card__site">
    <ui-favicon [letter]="letter()" />
    <span class="link-card__host">{{ host() }}</span>
  </span>
  <ui-button
    slot="favorite"
    variant="ghost"
    size="sm"
    iconOnly
    hitArea="overlay"
    [iconLeft]="link().isFavorite ? 'star-filled' : 'star'"
    [ariaPressed]="link().isFavorite"
    [ariaLabel]="'links.item.favorite' | transloco: { title: link().title }"
    (click)="favoriteToggled.emit()"
  />
  <ui-button
    slot="actions"
    variant="ghost"
    size="sm"
    iconOnly
    iconLeft="more"
    [uiMenuTrigger]="menu"
    [ariaLabel]="'links.item.actions' | transloco: { title: link().title }"
  />
  @if (link().note; as note) {
    <p class="link-card__note">{{ note }}</p>
  }
  @if (tags().length > 0) {
    <ul class="link-card__tags">
      @for (tag of tags(); track tag) {
        <li>
          <ui-chip>{{ tag }}</ui-chip>
        </li>
      }
    </ul>
  }
  <ui-menu
    #menu
    align="end"
    [ariaLabel]="'links.item.actions' | transloco: { title: link().title }"
  >
    <ui-menu-item icon="trash" danger (activated)="deleteRequested.emit()">
      {{ 'links.item.delete' | transloco }}
    </ui-menu-item>
  </ui-menu>
</ui-card>
