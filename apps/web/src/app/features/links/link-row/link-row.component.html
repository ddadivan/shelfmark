<ui-list-item
  [href]="href()"
  newTab
  [reveal]="reveal()"
  [description]="href() ? ('links.item.opensInNewTab' | transloco) : undefined"
  (activated)="open()"
>
  <ui-favicon slot="leading" [src]="favicon()" [letter]="letter()" />
  <span slot="title">{{ link().title }}</span>
  <span slot="meta">{{ host() }}</span>
  <div slot="trailing" class="link-row__trailing">
    @if (tags().length > 0) {
      <ul class="link-row__tags">
        @for (tag of tags(); track tag) {
          <li>
            <ui-chip>{{ tag }}</ui-chip>
          </li>
        }
      </ul>
    }
    <ui-button
      variant="ghost"
      size="sm"
      iconOnly
      hitArea="overlay"
      [iconLeft]="link().isFavorite ? 'star-filled' : 'star'"
      [ariaPressed]="link().isFavorite"
      [ariaLabel]="'links.item.favorite' | transloco: { title: link().title }"
      (click)="favoriteToggled.emit()"
    />
    <ui-button
      variant="ghost"
      size="sm"
      iconOnly
      iconLeft="more"
      [uiMenuTrigger]="menu"
      [ariaLabel]="'links.item.actions' | transloco: { title: link().title }"
    />
    <ui-menu
      #menu
      align="end"
      [ariaLabel]="'links.item.actions' | transloco: { title: link().title }"
    >
      <ui-menu-item icon="edit" (activated)="editRequested.emit()">
        {{ 'links.item.edit' | transloco }}
      </ui-menu-item>
      <ui-menu-item icon="trash" danger (activated)="deleteRequested.emit()">
        {{ 'links.item.delete' | transloco }}
      </ui-menu-item>
    </ui-menu>
  </div>
</ui-list-item>
