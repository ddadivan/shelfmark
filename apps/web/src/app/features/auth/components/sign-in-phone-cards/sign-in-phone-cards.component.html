<div class="pc">
  @for (item of items(); track item.card.id) {
    <div
      class="pc-card pc-card--{{ item.card.layer }}"
      [style.--pc-x]="item.place.x"
      [style.--pc-y]="item.place.y"
      [style.--pc-s]="item.place.scale"
      [style.--pc-r]="item.place.rotate + 'deg'"
      [style.--pc-spin]="item.place.spin + 'deg'"
      [style.--pc-wave]="item.place.wave"
      [style.--pc-t]="item.place.duration + 's'"
      [style.--pc-d]="item.place.delay + 's'"
      [style.--pc-ax]="item.place.ampX"
      [style.--pc-ay]="item.place.ampY"
    >
      <div class="pc-fly">
        <div class="pc-float">
          <div class="pc-size">
            <app-link-preview-card
              [title]="'auth.signIn.tiles.' + item.card.id + '.title' | transloco"
              [host]="item.card.host"
              [daysAgo]="item.card.daysAgo"
              [tone]="item.card.tone"
              [tags]="item.tags"
            />
          </div>
        </div>
      </div>
    </div>
  }
</div>
