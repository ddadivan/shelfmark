<div class="boot boot--page" aria-hidden="true">
  <!-- The demo banner (the real one: shell/demo-banner), the same height, colour and wrapping. The
       only user of this component is the demo start, so it is always shown here. -->
  <div class="boot__banner">
    <span class="boot__block boot__banner-text"></span>
    <span class="boot__block boot__banner-button"></span>
  </div>
  <div class="boot__body">
    <div class="boot__sidebar">
      <!-- The sidebar of the loaded app (shell + sidebar.component): the logo row with the avatar, the
             Add link button, the five fixed rows, the Pinned, Folders and Tags groups and the footer. -->
      <div class="boot__side-head">
        <span class="boot__block boot__mark"></span>
        <span class="boot__block boot__wordmark"></span>
        <span class="boot__block boot__avatar boot__avatar--side"></span>
      </div>
      <span class="boot__block boot__add-link"></span>
      <div class="boot__side-scroll">
        <div class="boot__nav">
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
        </div>
        <div class="boot__group">
          <span class="boot__group-head"><span class="boot__block boot__group-title"></span></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
        </div>
        <div class="boot__group">
          <span class="boot__group-head"><span class="boot__block boot__group-title"></span></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
        </div>
        <div class="boot__group">
          <span class="boot__group-head"><span class="boot__block boot__group-title"></span></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
          <span class="boot__nav-row"
            ><span class="boot__block boot__nav-icon"></span
            ><span class="boot__block boot__nav-name"></span
            ><span class="boot__block boot__nav-count"></span
          ></span>
        </div>
      </div>
      <div class="boot__footer">
        <span class="boot__block boot__card-note"></span>
        <span class="boot__nav-row boot__nav-row--footer boot__nav-row--extension"
          ><span class="boot__block boot__nav-icon"></span
          ><span class="boot__block boot__nav-name"></span
        ></span>
        <span class="boot__nav-row boot__nav-row--footer"
          ><span class="boot__block boot__nav-icon"></span
          ><span class="boot__block boot__nav-name"></span
        ></span>
        <span class="boot__nav-row boot__nav-row--footer"
          ><span class="boot__block boot__nav-icon"></span
          ><span class="boot__block boot__nav-name"></span
        ></span>
      </div>
    </div>
    <div class="boot__content">
      <div class="boot__topbar">
        <span class="boot__block boot__top-logo"></span>
        <span class="boot__block boot__avatar"></span>
      </div>
      <div class="boot__header">
        <span class="boot__block boot__search"></span>
        <span class="boot__spacer"></span>
        <span class="boot__block boot__add"></span>
      </div>
      <div class="boot__main">
        <span class="boot__block boot__title"></span>
        <span class="boot__block boot__count"></span>
        @if (extensionBanner.bannerShown()) {
          <span class="boot__extension boot__extension--shown"></span>
        }
        <div class="boot__grid">
          @for (card of cards; track card) {
            <div class="boot__card">
              <span class="boot__block boot__media"></span
              ><span class="boot__card-body"
                ><span class="boot__block boot__line boot__line--long"></span
                ><span class="boot__block boot__line boot__line--medium"></span
                ><span class="boot__block boot__line boot__line--meta"></span
              ></span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
  <div class="boot__tabbar">
    <span class="boot__block boot__tab"></span>
    <span class="boot__block boot__tab"></span>
    <span class="boot__block boot__tab boot__tab--add"></span>
    <span class="boot__block boot__tab"></span>
    <span class="boot__block boot__tab"></span>
  </div>
</div>
