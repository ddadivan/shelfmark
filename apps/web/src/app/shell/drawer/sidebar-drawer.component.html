<div class="drawer__head">
  <ui-button
    variant="ghost"
    iconOnly
    iconLeft="close"
    [ariaLabel]="'shell.drawer.close' | transloco"
    (click)="closeRequested.emit()"
  />
  <ui-logo />
</div>
<div class="drawer__body">
  <app-sidebar />
</div>
@if (auth.user(); as user) {
  <div class="drawer__foot">
    <ui-avatar [name]="user.name" [src]="user.image ?? undefined" size="sm" />
    <span class="drawer__name">{{ user.name }}</span>
    <ui-button
      variant="ghost"
      iconOnly
      iconLeft="settings"
      [ariaLabel]="'shell.settings' | transloco"
      (click)="openSettings()"
    />
  </div>
}
