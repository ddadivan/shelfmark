<app-demo-banner />
<div class="shell__body">
  <!-- Below the phone breakpoint (40em) the sidebar is the drawer, opened from the header. -->
  @if (!viewport.phone()) {
    <div class="shell__sidebar"><app-sidebar showLogo /></div>
  }
  <div class="shell__content">
    <header class="shell__header">
      @if (viewport.phone()) {
        <ui-button
          class="shell__menu"
          variant="ghost"
          iconOnly
          iconLeft="menu"
          [iconSize]="ICON_SIZE.Lg"
          [ariaLabel]="'shell.menu' | transloco"
          [ariaExpanded]="nav.isOpen()"
          (click)="nav.open()"
        />
        <ui-logo />
        <ui-button
          class="shell__search"
          variant="ghost"
          size="sm"
          iconOnly
          iconLeft="search"
          [iconSize]="ICON_SIZE.Lg"
          [ariaLabel]="'shell.search' | transloco"
          (click)="search.open()"
        />
      } @else {
        <ui-search-trigger
          class="shell__pill"
          ariaHaspopup="dialog"
          ariaKeyshortcuts="Meta+K Control+K"
          [label]="'shell.searchHint' | transloco"
          [shortcut]="searchShortcut"
          (click)="search.open()"
        />
        <span class="shell__spacer"></span>
        <ui-button
          variant="ghost"
          iconOnly
          [iconLeft]="themeIcon()"
          [iconSize]="ICON_SIZE.Lg"
          [ariaLabel]="
            (theme.resolved() === THEME.Dark ? 'shell.theme.toLight' : 'shell.theme.toDark')
              | transloco
          "
          (click)="toggleTheme()"
        />
        <ui-button class="shell__add" variant="primary" iconLeft="add" (click)="actions.addLink()">
          {{ 'shell.addLink' | transloco }}
        </ui-button>
      }
      @if (auth.user(); as user) {
        <div class="shell__user">
          <ui-button
            [uiMenuTrigger]="accountMenu"
            variant="ghost"
            [size]="accountButtonSize"
            [ariaLabel]="'shell.accountMenu' | transloco"
          >
            <ui-avatar [name]="user.name" [src]="user.image ?? undefined" />
          </ui-button>
          <ui-menu #accountMenu align="end" [ariaLabel]="'shell.accountMenu' | transloco">
            <ui-menu-item icon="settings" (activated)="openSettings()">
              {{ 'shell.settings' | transloco }}
            </ui-menu-item>
            <ui-menu-item icon="download" (activated)="exportAll(EXPORT_FORMAT.Json)">
              {{ 'export.all.json' | transloco }}
            </ui-menu-item>
            <ui-menu-item icon="bookmark" (activated)="exportAll(EXPORT_FORMAT.Html)">
              {{ 'export.all.html' | transloco }}
            </ui-menu-item>
            <ui-menu-separator />
            <ui-menu-item icon="logout" (activated)="signOut()">
              {{ 'auth.signOut' | transloco }}
            </ui-menu-item>
          </ui-menu>
        </div>
      }
    </header>
    <div class="shell__row">
      <main class="shell__main">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
<!-- Phone: the add action is the floating button of the mobile design (header button is off). -->
@if (viewport.phone()) {
  <ui-button
    class="shell__fab"
    variant="primary"
    iconOnly
    fab
    iconLeft="add"
    [ariaLabel]="'shell.addLink' | transloco"
    (click)="actions.addLink()"
  />
}
