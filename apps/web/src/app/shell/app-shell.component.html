<header class="shell__header">
  <ui-logo />
  <ui-button
    class="shell__add"
    variant="primary"
    size="sm"
    iconLeft="add"
    (click)="actions.addLink()"
  >
    {{ 'shell.addLink' | transloco }}
  </ui-button>
  <!-- The phone header has no room for the label: the same action as an icon. -->
  <ui-button
    class="shell__add-icon"
    variant="primary"
    size="sm"
    iconOnly
    iconLeft="add"
    [ariaLabel]="'shell.addLink' | transloco"
    (click)="actions.addLink()"
  />
  <ui-button
    class="shell__search"
    variant="ghost"
    size="sm"
    iconOnly
    iconLeft="search"
    [ariaLabel]="'shell.search' | transloco"
    (click)="search.open()"
  />
  @if (auth.user(); as user) {
    <div class="shell__user">
      @if (recentToggleLabel(); as label) {
        <ui-button
          class="shell__recent-toggle"
          variant="ghost"
          size="sm"
          iconOnly
          iconLeft="panel-right"
          [ariaPressed]="ui.recentVisible()"
          [ariaLabel]="label"
          (click)="toggleRecent()"
        />
      }
      <span class="shell__name">{{ user.name }}</span>
      <ui-button
        [uiMenuTrigger]="accountMenu"
        variant="ghost"
        size="sm"
        iconRight="chevron-down"
        [ariaLabel]="'shell.accountMenu' | transloco"
      >
        <ui-avatar [name]="user.name" [src]="user.image ?? undefined" size="sm" />
      </ui-button>
      <ui-menu #accountMenu align="end" [ariaLabel]="'shell.accountMenu' | transloco">
        <ui-menu-item icon="settings" (activated)="openSettings()">
          {{ 'shell.settings' | transloco }}
        </ui-menu-item>
        <ui-menu-item icon="download" (activated)="exportAll(EXPORT_FORMAT.Json)">
          {{ 'export.all.json' | transloco }}
        </ui-menu-item>
        <ui-menu-item icon="download" (activated)="exportAll(EXPORT_FORMAT.Html)">
          {{ 'export.all.html' | transloco }}
        </ui-menu-item>
        <ui-menu-separator />
        <ui-menu-item icon="logout" (activated)="signOut()">
          {{ 'auth.signOut' | transloco }}
        </ui-menu-item>
      </ui-menu>
    </div>
  }
</header>
<div class="shell__body">
  <app-sidebar />
  <main class="shell__main">
    <router-outlet />
  </main>
  @if (ui.recentVisible()) {
    <app-recent-links-panel class="shell__recent" />
  }
</div>
