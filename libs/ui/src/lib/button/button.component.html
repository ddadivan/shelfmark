<ng-template #content>
  @if (iconOnly()) {
    @if (singleIcon(); as icon) {
      <ui-icon [name]="icon" [size]="iconSize()" />
    }
  } @else {
    @if (iconLeft(); as icon) {
      <ui-icon [name]="icon" [size]="iconSize()" />
    }
    <ng-content />
    @if (iconRight(); as icon) {
      <ui-icon [name]="icon" [size]="iconSize()" />
    }
  }
</ng-template>

@if (isLink()) {
  <a
    #control
    [class]="classes()"
    [uiRipple]="rippleActive()"
    [attr.href]="disabled() ? null : href()"
    [attr.role]="disabled() ? 'link' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-haspopup]="ariaHaspopup() ?? null"
    [attr.aria-describedby]="ariaDescribedby() || null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    (click)="onLinkClick($event)"
  >
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <button
    #control
    [class]="classes()"
    [uiRipple]="rippleActive()"
    [attr.type]="type()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-haspopup]="ariaHaspopup() ?? null"
    [attr.aria-describedby]="ariaDescribedby() || null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [disabled]="disabled()"
  >
    <ng-container *ngTemplateOutlet="content" />
  </button>
}
