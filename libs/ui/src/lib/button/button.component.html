<ng-template #content>
  @if (loading()) {
    <ui-spinner
      class="ui-button__spinner"
      [class.ui-button__spinner--solo]="iconOnly()"
      animate.leave="ui-button__spinner--leave"
    />
  }
  @if (iconOnly()) {
    @if (singleIcon(); as icon) {
      @if (!loading()) {
        <ui-icon [name]="icon" [size]="iconSize()" />
      }
    }
  } @else {
    @if (iconLeft(); as icon) {
      @if (!loading()) {
        <ui-icon [name]="icon" [size]="iconSize()" />
      }
    }
    <ng-content />
    @if (iconRight(); as icon) {
      <ui-icon [name]="icon" [size]="iconSize()" />
    }
  }
</ng-template>

@if (isLink()) {
  <a
    #control
    [class]="classes()"
    [uiRipple]="rippleActive()"
    [attr.href]="inert() ? null : href()"
    [attr.role]="inert() ? 'link' : null"
    [attr.aria-disabled]="inert() ? 'true' : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-haspopup]="ariaHaspopup() ?? null"
    [attr.aria-describedby]="ariaDescribedby() || null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.tabindex]="tabIndex() ?? null"
    [style.width.px]="lockedWidth() ?? null"
    (click)="onLinkClick($event)"
  >
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <button
    #control
    [class]="classes()"
    [uiRipple]="rippleActive()"
    [attr.type]="type()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-haspopup]="ariaHaspopup() ?? null"
    [attr.aria-describedby]="ariaDescribedby() || null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.tabindex]="tabIndex() ?? null"
    [style.width.px]="lockedWidth() ?? null"
    [disabled]="disabled()"
  >
    <ng-container *ngTemplateOutlet="content" />
  </button>
}
