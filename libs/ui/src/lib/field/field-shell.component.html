<div
  class="ui-field"
  [class.ui-field--error]="invalid() || !!error()"
  [class.ui-field--disabled]="disabled()"
>
  <label class="ui-field__label" [attr.for]="controlId()">{{ label() }}</label>
  <div
    class="ui-field__control"
    [class.ui-field__control--url]="mono()"
    [class.ui-field__control--textarea]="multiline()"
  >
    <ng-content />
  </div>
  <div class="ui-field__message" [class.ui-field__message--filled]="hasMessage()">
    @if (hint()) {
      <span class="ui-field__hint" [id]="hintId()" [class.ui-field__hint--hidden]="!!error()">{{
        hint()
      }}</span>
    }
    <span class="ui-field__error" [id]="errorId()" aria-live="polite">{{ error() }}</span>
    @if (counter()) {
      <span class="ui-field__counter" [id]="counterId()"
        >{{ counter() }}
        @if (counterLabel()) {
          <span class="ui-field__counter-label"> {{ counterLabel() }}</span>
        }
      </span>
    }
  </div>
</div>
