<div
  ngMenuItem
  class="ui-menu-item"
  [class.ui-menu-item--danger]="danger()"
  [class.is-selected]="selected()"
  [disabled]="disabled()"
  [role]="role()"
  [searchTerm]="searchText()"
  [attr.aria-checked]="role() === 'menuitem' ? null : selected()"
  uiRipple
>
  @if (icon(); as name) {
    <ui-icon class="ui-menu-item__icon" [name]="name" [size]="16" />
  }
  <span #label class="ui-menu-item__label"><ng-content /></span>
  @if (shortcut(); as hint) {
    <kbd class="ui-menu-item__hint">{{ hint }}</kbd>
  }
</div>
