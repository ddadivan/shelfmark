@if (imageSrc(); as url) {
  <img
    class="ui-avatar__image"
    alt=""
    referrerpolicy="no-referrer"
    [src]="url"
    (error)="failed.set(true)"
  />
} @else if (initials(); as letters) {
  <span class="ui-avatar__initials">{{ letters }}</span>
} @else {
  <ui-icon name="user" [size]="iconSize()" />
}
