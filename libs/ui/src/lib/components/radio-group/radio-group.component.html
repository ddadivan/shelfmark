@for (option of options(); track option.value; let i = $index) {
  <label class="ui-radio" [class.ui-radio--checked]="value() === option.value">
    <input
      type="radio"
      class="ui-radio__input"
      [name]="name() || groupId"
      [value]="option.value"
      [checked]="value() === option.value"
      [disabled]="disabled()"
      [attr.aria-describedby]="option.description ? groupId + '-' + i + '-desc' : null"
      (change)="select(option)"
    />
    <span class="ui-radio__dot" aria-hidden="true"></span>
    @if (option.flag) {
      <ui-flag class="ui-radio__flag" [code]="option.flag" />
    } @else if (option.icon) {
      <ui-icon class="ui-radio__icon" [name]="option.icon" [size]="ICON_SIZE.Md" />
    }
    <span class="ui-radio__text">
      <span class="ui-radio__title" [attr.lang]="option.lang ?? null">{{ option.title }}</span>
      @if (option.description) {
        <span class="ui-radio__desc" [id]="groupId + '-' + i + '-desc'">{{
          option.description
        }}</span>
      }
    </span>
  </label>
}
