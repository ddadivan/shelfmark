<div ngToolbar class="ui-bulk-bar__bar" orientation="horizontal" [attr.aria-label]="ariaLabel()">
  @for (item of actions(); track item.id; let index = $index) {
    @if (index === dividerAt()) {
      <span class="ui-bulk-bar__divider" aria-hidden="true"></span>
    }
    <button
      ngToolbarWidget
      type="button"
      class="ui-bulk-bar__action"
      uiRipple
      [class.ui-bulk-bar__action--danger]="item.danger"
      [class.ui-bulk-bar__action--secondary]="item.variant === BULK_BAR_ACTION_VARIANT.Secondary"
      [disabled]="item.disabled ?? false"
      [attr.aria-pressed]="item.pressed === undefined ? null : item.pressed"
      [attr.data-action]="item.id"
      (click)="press(item)"
    >
      @if (item.folder; as folder) {
        <ui-folder-icon
          class="ui-bulk-bar__folder"
          [icon]="folder.icon ?? 'folder'"
          [colour]="folder.colour ?? FOLDER_COLOUR.Graphite"
          [size]="FOLDER_ICON_SIZE.Sm"
        />
      } @else if (item.icon) {
        <ui-icon class="ui-bulk-bar__icon" [name]="item.icon" [size]="ICON_SIZE.Md" />
      }
      <span class="ui-bulk-bar__label">{{ item.label }}</span>
    </button>
  }
</div>
