<div
  #panel
  class="ui-drawer"
  [class.ui-drawer--end]="side() === DRAWER_SIDE.End"
  [class.ui-drawer--wide]="width() === DRAWER_WIDTH.Wide"
  [class.ui-drawer--resizable]="canResize()"
  [class.ui-drawer--enter]="!leaving()"
  [class.ui-drawer--leave]="leaving()"
>
  @if (canResize()) {
    <div
      class="ui-drawer__resize"
      role="separator"
      tabindex="0"
      aria-orientation="vertical"
      [attr.aria-label]="resizeLabel() || null"
      [attr.aria-valuenow]="current()"
      [attr.aria-valuemin]="minWidth()"
      [attr.aria-valuemax]="maxNow()"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
      (keydown)="onKeydown($event)"
      (dblclick)="reset()"
    >
      <span class="ui-drawer__grip" aria-hidden="true"></span>
    </div>
  }
  <div class="ui-drawer__head">
    <div class="ui-drawer__head-slot"><ng-content select="[slot=head]" /></div>
    <ui-button
      variant="ghost"
      [size]="BUTTON_SIZE.Lg"
      iconOnly
      iconLeft="close"
      [ariaLabel]="closeLabel()"
      (click)="requestClose()"
    />
  </div>
  <div class="ui-drawer__body"><ng-content /></div>
  <div class="ui-drawer__foot"><ng-content select="[slot=foot]" /></div>
</div>
