<ui-field-shell
  [controlId]="controlId"
  [label]="label()"
  [hint]="hint()"
  [error]="message()"
  [invalid]="showInvalid()"
  [disabled]="disabled()"
  [labelHidden]="row()"
  (click)="onHostClick($event)"
>
  <button
    #trigger
    ngCombobox
    #combobox="ngCombobox"
    type="button"
    class="ui-select__trigger"
    [id]="controlId"
    [disabled]="disabled()"
    [softDisabled]="false"
    [expanded]="open()"
    (expandedChange)="onExpandedChange($event)"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="showInvalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (keydown)="onTriggerKeydown($event)"
    (blur)="onTriggerBlur($event)"
  >
    @if (chosen()?.icon || chosen()?.colour) {
      <ui-folder-icon
        class="ui-select__tile"
        [size]="FOLDER_ICON_SIZE.Sm"
        [icon]="chosen()?.icon ?? 'folder'"
        [colour]="chosen()?.colour ?? 'graphite'"
      />
    } @else {
      <ui-icon class="ui-select__icon" [name]="triggerIcon()" [size]="ICON_SIZE.Md" />
    }
    @if (row()) {
      <span class="ui-select__row-text">
        @if (rowLead()) {
          {{ rowLead() }}
        }
        <b class="ui-select__value ui-select__row-value" [attr.lang]="chosen()?.lang ?? null">{{
          triggerText()
        }}</b>
        @if (rowNote()) {
          <span class="ui-select__row-note">{{ ' · ' + rowNote() }}</span>
        }
      </span>
      @if (chosen()?.badge; as badge) {
        <ui-badge class="ui-select__badge" [tone]="BADGE_TONE.Accent">{{ badge }}</ui-badge>
      }
      @if (rowAction()) {
        {{ ' ' }}<span class="ui-select__row-action">{{ rowAction() }}</span>
      }
    } @else {
      <span
        class="ui-select__value"
        [class.ui-select__value--placeholder]="!chosen()"
        [attr.lang]="chosen()?.lang ?? null"
        >{{ triggerText() }}</span
      >
      @if (chosen()?.badge; as badge) {
        <ui-badge class="ui-select__badge" [tone]="BADGE_TONE.Accent">{{ badge }}</ui-badge>
      }
      <ui-icon class="ui-select__chevron" name="chevron-down" [size]="ICON_SIZE.Md" />
    }
  </button>
</ui-field-shell>

<div
  #popup
  class="ui-select__popup"
  [class.ui-select__popup--shown]="attached()"
  (mousedown)="onPopupMousedown($event)"
  (focusin)="onPopupFocusin()"
  (focusout)="onPopupFocusout($event)"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div class="ui-select__panel" animate.enter="ui-select--enter" animate.leave="ui-select--leave">
      @if (searchable()) {
        <div class="ui-select__search">
          <div class="ui-select__search-box">
            <ui-icon class="ui-select__search-icon" name="search" [size]="ICON_SIZE.Md" />
            <input
              #search
              class="ui-select__search-input"
              type="text"
              role="combobox"
              aria-expanded="true"
              aria-haspopup="listbox"
              autocomplete="off"
              spellcheck="false"
              aria-autocomplete="list"
              [attr.aria-label]="searchLabel() || null"
              [attr.placeholder]="searchLabel() || null"
              [attr.aria-controls]="list.id()"
              [attr.aria-activedescendant]="list.activeDescendant() ?? null"
              [value]="query()"
              (input)="onSearch($event)"
              (keydown)="onSearchKeydown($event)"
            />
          </div>
        </div>
      }
      <div
        ngComboboxWidget
        ngListbox
        #list="ngListbox"
        class="ui-select__list"
        focusMode="activedescendant"
        selectionMode="explicit"
        tabindex="-1"
        [attr.aria-label]="label()"
        [activeDescendant]="searchable() ? undefined : list.activeDescendant()"
        [value]="selection()"
        [hidden]="!hasRows()"
        (valueChange)="onListValue($event)"
      >
        @for (row of rows(); track row.id) {
          <div
            ngOption
            uiRipple
            class="ui-select__option"
            [class.is-selected]="row.id === value()"
            [value]="row.id"
            [label]="row.name"
            [attr.aria-label]="row.level > 0 ? row.path : null"
            [style.--ui-select-level]="row.level"
          >
            @if (row.icon || row.colour) {
              <ui-folder-icon
                class="ui-select__tile"
                [size]="FOLDER_ICON_SIZE.Sm"
                [icon]="row.icon ?? 'folder'"
                [colour]="row.colour ?? 'graphite'"
              />
            } @else {
              <ui-icon
                class="ui-select__option-icon"
                [name]="rowIcon(row.id)"
                [size]="ICON_SIZE.Md"
              />
            }
            <span class="ui-select__option-label" [attr.lang]="row.lang ?? null">{{
              row.name
            }}</span>
            @if (row.badge) {
              <ui-badge [tone]="BADGE_TONE.Accent">{{ row.badge }}</ui-badge>
            }
            @if (row.id === value()) {
              <ui-icon class="ui-select__check" name="check" [size]="ICON_SIZE.Md" />
            }
          </div>
        }
        @if (createText() !== null) {
          <div
            ngOption
            uiRipple
            class="ui-select__option ui-select__option--create"
            [value]="SELECT_CREATE_ID"
            [label]="createRowLabel()"
          >
            <ui-icon
              class="ui-select__option-icon"
              [name]="SELECT_ICON.Create"
              [size]="ICON_SIZE.Md"
            />
            <span class="ui-select__option-label">{{ createRowLabel() }}</span>
          </div>
        }
      </div>
      <div class="ui-select__status" [class.ui-select__status--filled]="!hasRows()" role="status">
        @if (!hasRows()) {
          {{ noResultsLabel() }}
        }
      </div>
    </div>
  </ng-template>
</div>
