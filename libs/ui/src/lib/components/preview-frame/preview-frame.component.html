<div class="ui-preview-frame" [attr.aria-busy]="loading()">
  <ui-progress-bar
    class="ui-preview-frame__progress"
    [active]="loading()"
    [variant]="PROGRESS_BAR_VARIANT.Inline"
  />
  <iframe
    #frame
    class="ui-preview-frame__iframe"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
    referrerpolicy="no-referrer"
    allow="fullscreen; picture-in-picture; encrypted-media"
    loading="eager"
    [attr.title]="title()"
    [hidden]="phase() === PREVIEW_FRAME_PHASE.Rejected"
    (load)="onLoad()"
  ></iframe>
</div>
