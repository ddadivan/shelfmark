@if (readonly()) {
  <div class="ui-rating-scale__items" role="img" [attr.aria-label]="readonlyLabel() || null">
    @for (value of scores(); track value) {
      <span class="ui-rating-scale__item" [class.is-on]="value === score()">{{ value }}</span>
    }
  </div>
} @else {
  <div class="ui-rating-scale__items">
    @for (value of scores(); track value) {
      <button
        #item
        type="button"
        class="ui-rating-scale__item"
        [class.is-on]="value === score()"
        [attr.aria-label]="labels()[value - 1] || null"
        [attr.aria-pressed]="score() === null ? null : value === score()"
        [attr.tabindex]="tabStop() === value ? 0 : -1"
        (click)="picked.emit(value)"
        (focusin)="tabStop.set(value)"
      >
        {{ value }}
      </button>
    }
  </div>
  @if (lowLabel() || highLabel()) {
    <div class="ui-rating-scale__ends" aria-hidden="true">
      <span>{{ lowLabel() }}</span>
      <span>{{ highLabel() }}</span>
    </div>
  }
}
