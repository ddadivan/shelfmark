<ui-field-shell
  [controlId]="controlId"
  [label]="label()"
  [hint]="hint()"
  [compact]="compact()"
  [labelHidden]="labelHidden()"
  [error]="message()"
  [invalid]="showInvalid()"
  [disabled]="disabled()"
  [mono]="type() === INPUT_TYPE.Url"
>
  @if (glyph(); as name) {
    <span class="ui-input__slot">
      @if (spinning()) {
        <ui-spinner
          class="ui-input__glyph"
          [label]="loadingLabel() || undefined"
          animate.leave="ui-input__glyph--leave"
        />
      } @else {
        <ui-icon
          class="ui-input__glyph"
          [class.ui-input__glyph--return]="iconReturns()"
          [name]="name"
        />
      }
    </span>
  }
  <!-- A decorative lead the feature projects (`uiInputLead`), e.g. the folder tile of Rename. -->
  <span class="ui-input__lead"><ng-content select="[uiInputLead]" /></span>
  <span class="ui-input__text">
    <input
      #native
      class="ui-input__native"
      [class.ui-input__native--dissolving]="dissolveWords().length > 0"
      [id]="controlId"
      [type]="type()"
      [value]="value()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [attr.placeholder]="placeholder() || null"
      [attr.inputmode]="type() === INPUT_TYPE.Url ? 'url' : null"
      [attr.spellcheck]="type() === INPUT_TYPE.Url ? 'false' : null"
      [attr.autocomplete]="type() === INPUT_TYPE.Url ? 'off' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-busy]="loading() ? 'true' : null"
      [attr.aria-invalid]="showInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="touch.emit()"
    />
    @if (dissolveWords().length > 0) {
      <!-- The cleared text, dissolving word by word on top of the (already empty) field. -->
      <span
        class="ui-input__dissolve"
        aria-hidden="true"
        [style.--ui-dissolve-step.ms]="dissolveStep()"
        (animationend)="onDissolveEnd($event)"
      >
        @for (word of dissolveWords(); track $index) {
          <span class="ui-input__word" [style.--ui-dissolve-i]="$index">{{ word }}</span>
        }
      </span>
    }
  </span>
  @if (trailingSpinner()) {
    <ui-spinner
      class="ui-input__spinner"
      [label]="loadingLabel() || undefined"
      animate.leave="ui-input__spinner--leave"
    />
  }
  @if (showClear()) {
    <button
      type="button"
      class="ui-input__clear"
      [attr.aria-label]="clearLabel()"
      [uiTooltip]="clearLabel()"
      (mousedown)="$event.preventDefault()"
      (click)="clear()"
    >
      <ui-icon name="close" />
    </button>
  }
  @if (shortcut()) {
    <kbd class="ui-input__kbd" aria-hidden="true">{{ shortcut() }}</kbd>
  }
</ui-field-shell>
