<input
  #picker
  type="file"
  class="ui-drop-zone__input"
  tabindex="-1"
  aria-hidden="true"
  [attr.accept]="accept() || null"
  [disabled]="disabled()"
  (change)="onPick(picker)"
/>
<ui-icon class="ui-drop-zone__icon" name="upload" [size]="ICON_SIZE.Md" />
<div class="ui-drop-zone__body">
  <span class="ui-drop-zone__row">
    @if (label()) {
      <span class="ui-drop-zone__label">{{ label() }}</span>
    }
    <ui-button [size]="BUTTON_SIZE.Sm" [disabled]="disabled()" (click)="openPicker(picker)">{{
      actionLabel()
    }}</ui-button>
  </span>
  @if (hint()) {
    <span class="ui-drop-zone__hint">{{ hint() }}</span>
  }
</div>
