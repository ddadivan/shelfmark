<button
  #control
  type="button"
  class="ui-search-trigger__control"
  [attr.aria-keyshortcuts]="ariaKeyshortcuts() || null"
  [attr.aria-haspopup]="ariaHaspopup() ?? null"
>
  <ui-icon class="ui-search-trigger__icon" name="search" />
  <span class="ui-search-trigger__label">{{ label() }}</span>
  @if (shortcut()) {
    <kbd class="ui-search-trigger__kbd" aria-hidden="true">{{ shortcut() }}</kbd>
  }
</button>
