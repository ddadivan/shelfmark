@if (open()) {
  <div
    class="ui-tooltip-hit"
    [class]="'ui-tooltip-hit--' + side()"
    aria-hidden="true"
    (pointerenter)="hovered.emit(true)"
    (pointerleave)="hovered.emit(false)"
  >
    <div class="ui-tooltip" animate.enter="ui-tooltip--enter" animate.leave="ui-tooltip--leave">
      <span class="ui-tooltip__text">{{ text() }}</span>
      @if (shortcut()) {
        <kbd class="ui-tooltip__kbd">{{ shortcut() }}</kbd>
      }
    </div>
  </div>
}
