<div class="ui-theme-preview__sidebar" aria-hidden="true">
  @for (folder of folders(); track $index) {
    <span class="ui-theme-preview__row" [class.ui-theme-preview__row--active]="$first">
      <span class="ui-theme-preview__glyph"></span>
      {{ folder }}
    </span>
  }
</div>
<div class="ui-theme-preview__cards" aria-hidden="true">
  @for (card of cards(); track $index) {
    <span class="ui-theme-preview__card" [class.ui-theme-preview__card--alt]="$odd">
      <span class="ui-theme-preview__media"></span>
      <span class="ui-theme-preview__site">{{ card.site }}</span>
      <span class="ui-theme-preview__title">{{ card.title }}</span>
      <span class="ui-theme-preview__tag">{{ card.tag }}</span>
    </span>
  }
</div>
