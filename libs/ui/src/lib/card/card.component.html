<!-- The text sits above the stretched link: the full-title tooltip follows hover on it only. -->
<ng-template #title>
  <span #titleText class="ui-card__title-text"><ng-content select="[slot=title]" /></span>
</ng-template>

<ng-template #control>
  @if (href(); as url) {
    <a
      #titleLink
      class="ui-card__link"
      [uiTooltip]="cutTitle()"
      [uiTooltipPointerTarget]="titleText()?.nativeElement ?? null"
      (pointerenter)="measureTitle(titleLink)"
      (focus)="measureTitle(titleLink)"
      [attr.href]="url"
      [attr.target]="newTab() ? '_blank' : null"
      [attr.rel]="newTab() ? 'noopener noreferrer' : 'noreferrer'"
      [attr.aria-current]="selected() ? 'true' : null"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="activated.emit($event)"
    >
      <ng-container [ngTemplateOutlet]="title" />
    </a>
  } @else {
    <button
      #titleLink
      type="button"
      class="ui-card__link"
      [uiTooltip]="cutTitle()"
      [uiTooltipPointerTarget]="titleText()?.nativeElement ?? null"
      (pointerenter)="measureTitle(titleLink)"
      (focus)="measureTitle(titleLink)"
      [attr.aria-current]="selected() ? 'true' : null"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="activated.emit($event)"
    >
      <ng-container [ngTemplateOutlet]="title" />
    </button>
  }
</ng-template>

<div class="ui-card__media">
  @if (imageSrc(); as url) {
    <img
      class="ui-card__image"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      [src]="url"
      (error)="failed.set(true)"
    />
  } @else {
    <div class="ui-card__fallback"><ng-content select="[slot=fallback]" /></div>
    <div class="ui-card__placeholder" [attr.data-tone]="tone()" aria-hidden="true">
      <svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" focusable="false">
        <circle class="ui-card__art-glow" cx="132" cy="16" r="38" />
        <rect class="ui-card__art-card" x="18" y="26" width="88" height="54" rx="10" />
        <rect class="ui-card__art-bar" x="30" y="38" width="44" height="7" rx="3.5" />
        <rect
          class="ui-card__art-bar ui-card__art-bar--short"
          x="30"
          y="52"
          width="62"
          height="5"
          rx="2.5"
        />
      </svg>
    </div>
  }
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- decorative bar; it only forwards a pointer click to the title link, the keyboard path is the link itself -->
  <div class="ui-card__overlay" aria-hidden="true" (click)="forwardOverlayClick($event)">
    <ng-content select="[slot=overlay]" />
  </div>
</div>
<div class="ui-card__body">
  <div class="ui-card__meta">
    <div class="ui-card__site"><ng-content select="[slot=meta]" /></div>
    <div class="ui-card__date"><ng-content select="[slot=date]" /></div>
  </div>
  <!-- One branch per level: Angular templates cannot take a dynamic tag name. -->
  @switch (headingLevel()) {
    @case (1) {
      <h1 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h1>
    }
    @case (3) {
      <h3 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h3>
    }
    @case (4) {
      <h4 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h4>
    }
    @case (5) {
      <h5 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h5>
    }
    @case (6) {
      <h6 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h6>
    }
    @default {
      <h2 class="ui-card__heading"><ng-container [ngTemplateOutlet]="control" /></h2>
    }
  }
  <ng-content />
</div>
<div class="ui-card__actions">
  <div class="ui-card__favorite"><ng-content select="[slot=favorite]" /></div>
  <div class="ui-card__more"><ng-content select="[slot=actions]" /></div>
</div>
<div class="ui-card__select"><ng-content select="[slot=select]" /></div>
@if (description(); as text) {
  <span class="ui-card__description" [id]="descriptionId">{{ text }}</span>
}
