<ng-template #title>
  <ng-content select="[slot=title]" />
</ng-template>

<div class="ui-card__media">
  @if (imageSrc(); as url) {
    <img
      class="ui-card__image"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      [src]="url"
      (error)="failed.set(true)"
    />
  } @else {
    <div class="ui-card__fallback"><ng-content select="[slot=fallback]" /></div>
    <ui-icon class="ui-card__placeholder" name="image" [size]="24" />
  }
  <div class="ui-card__overlay" aria-hidden="true"><ng-content select="[slot=overlay]" /></div>
</div>
<div class="ui-card__body">
  <div class="ui-card__meta">
    <div class="ui-card__site"><ng-content select="[slot=meta]" /></div>
    <div class="ui-card__favorite"><ng-content select="[slot=favorite]" /></div>
  </div>
  @if (href(); as url) {
    <a
      class="ui-card__link"
      [attr.href]="url"
      [attr.target]="newTab() ? '_blank' : null"
      [attr.rel]="newTab() ? 'noopener noreferrer' : null"
      [attr.aria-current]="selected() ? 'true' : null"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="activated.emit($event)"
    >
      <ng-container [ngTemplateOutlet]="title" />
    </a>
  } @else {
    <button
      type="button"
      class="ui-card__link"
      [attr.aria-current]="selected() ? 'true' : null"
      [attr.aria-describedby]="description() ? descriptionId : null"
      (click)="activated.emit($event)"
    >
      <ng-container [ngTemplateOutlet]="title" />
    </button>
  }
  <ng-content />
</div>
<div class="ui-card__actions"><ng-content select="[slot=actions]" /></div>
@if (description(); as text) {
  <span class="ui-card__description" [id]="descriptionId">{{ text }}</span>
}
