<ui-field-shell
  [controlId]="controlId"
  [label]="label()"
  [hint]="hint()"
  [error]="message()"
  [invalid]="showInvalid()"
  [disabled]="disabled()"
  (click)="onHostClick($event)"
>
  <button
    #trigger
    ngCombobox
    #combobox="ngCombobox"
    type="button"
    class="ui-select__trigger"
    [id]="controlId"
    [disabled]="disabled()"
    [softDisabled]="false"
    [expanded]="open()"
    (expandedChange)="onExpandedChange($event)"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="showInvalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (keydown)="onTriggerKeydown($event)"
    (blur)="onTriggerBlur()"
  >
    <ui-icon class="ui-select__icon" [name]="triggerIcon()" [size]="16" />
    <span class="ui-select__value" [class.ui-select__value--placeholder]="!chosen()">{{
      triggerText()
    }}</span>
    <ui-icon class="ui-select__chevron" name="chevron-down" [size]="16" />
  </button>
</ui-field-shell>

<div
  #popup
  class="ui-select__popup"
  [class.ui-select__popup--shown]="attached()"
  (mousedown)="onPopupMousedown($event)"
  (focusin)="onPopupFocusin()"
  (focusout)="onPopupFocusout($event)"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div class="ui-select__panel" animate.enter="ui-select--enter" animate.leave="ui-select--leave">
      @if (searchable()) {
        <div class="ui-select__search">
          <div class="ui-select__search-box">
            <ui-icon class="ui-select__search-icon" name="search" [size]="16" />
            <input
              #search
              class="ui-select__search-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              aria-autocomplete="list"
              [attr.aria-label]="searchLabel() || null"
              [attr.placeholder]="searchLabel() || null"
              [attr.aria-controls]="list.id()"
              [attr.aria-activedescendant]="list.activeDescendant() ?? null"
              [value]="query()"
              (input)="onSearch($event)"
              (keydown)="onSearchKeydown($event)"
            />
          </div>
        </div>
      }
      <div
        ngComboboxWidget
        ngListbox
        #list="ngListbox"
        class="ui-select__list"
        focusMode="activedescendant"
        selectionMode="explicit"
        tabindex="-1"
        [attr.aria-label]="label()"
        [activeDescendant]="list.activeDescendant()"
        [value]="selection()"
        [hidden]="rows().length === 0"
        (valueChange)="onListValue($event)"
      >
        @for (row of rows(); track row.id) {
          <div
            ngOption
            uiRipple
            class="ui-select__option"
            [class.is-selected]="row.id === value()"
            [value]="row.id"
            [label]="row.name"
            [attr.aria-label]="row.level > 0 ? row.path : null"
            [style.--ui-select-level]="row.level"
          >
            <ui-icon
              class="ui-select__option-icon"
              [name]="row.id === null ? 'inbox' : 'folder'"
              [size]="16"
            />
            <span class="ui-select__option-label">{{ row.name }}</span>
            @if (row.id === value()) {
              <ui-icon class="ui-select__check" name="check" [size]="16" />
            }
          </div>
        }
      </div>
      <div
        class="ui-select__status"
        [class.ui-select__status--filled]="rows().length === 0"
        role="status"
      >
        @if (rows().length === 0) {
          {{ noResultsLabel() }}
        }
      </div>
    </div>
  </ng-template>
</div>
