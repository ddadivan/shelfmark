<label class="ui-checkbox__label" [attr.for]="controlId">
  <input
    #box
    type="checkbox"
    class="ui-checkbox__input"
    [id]="controlId"
    [attr.name]="name() || null"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="showInvalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (change)="onChange(box.checked)"
    (blur)="touch.emit()"
  />
  <span class="ui-checkbox__box" aria-hidden="true">
    @if (indeterminate()) {
      <span class="ui-checkbox__dash"></span>
    } @else {
      <ui-icon class="ui-checkbox__check" name="check" [size]="ICON_SIZE.Sm" />
    }
  </span>
  <span class="ui-checkbox__text">{{ label() }}</span>
</label>
@if (hint()) {
  <span class="ui-checkbox__hint" [class.ui-checkbox__hint--hidden]="!!message()" [id]="hintId">{{
    hint()
  }}</span>
}
<span class="ui-checkbox__error" [id]="errorId" aria-live="polite">{{ message() }}</span>
