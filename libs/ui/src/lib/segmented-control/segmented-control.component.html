@for (option of options(); track option.value) {
  <label
    class="ui-seg__item"
    [class.is-active]="value() === option.value"
    [class.is-disabled]="disabled() || option.disabled"
    [uiRipple]="!disabled() && !option.disabled"
  >
    <input
      type="radio"
      class="ui-seg__input"
      [name]="name() || groupId"
      [value]="option.value"
      [checked]="value() === option.value"
      [disabled]="disabled() || option.disabled"
      [attr.aria-label]="iconOnly() ? option.label : null"
      [uiTooltip]="iconOnly() ? option.label : ''"
      (change)="select(option)"
    />
    @if (option.icon; as icon) {
      <ui-icon [name]="icon" [size]="16" />
    }
    @if (!iconOnly()) {
      <span class="ui-seg__label">{{ option.label }}</span>
    }
  </label>
}
