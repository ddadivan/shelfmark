<ng-template #main>
  <span class="ui-list-item__title"><ng-content select="[slot=title]" /></span>
  <span class="ui-list-item__meta"><ng-content select="[slot=meta]" /></span>
  @if (description(); as text) {
    <span class="ui-list-item__description">{{ text }}</span>
  }
</ng-template>

<div class="ui-list-item__leading"><ng-content select="[slot=leading]" /></div>
@if (hasThumb()) {
  <div class="ui-list-item__thumb">
    @if (thumbSrc(); as url) {
      <img
        class="ui-list-item__image"
        alt=""
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        [src]="url"
        (error)="failed.set(true)"
      />
    } @else {
      <ui-icon name="image" [size]="16" />
    }
  </div>
}
@if (href(); as url) {
  <a
    class="ui-list-item__link"
    [attr.href]="url"
    [attr.target]="newTab() ? '_blank' : null"
    [attr.rel]="newTab() ? 'noopener noreferrer' : null"
    [attr.aria-current]="selected() ? 'true' : null"
    (click)="activated.emit($event)"
  >
    <ng-container [ngTemplateOutlet]="main" />
  </a>
} @else {
  <button
    type="button"
    class="ui-list-item__link"
    [attr.aria-current]="selected() ? 'true' : null"
    (click)="activated.emit($event)"
  >
    <ng-container [ngTemplateOutlet]="main" />
  </button>
}
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- only stops events bubbling to the row ripple; the wrapper is not interactive -->
<div
  class="ui-list-item__trailing"
  (pointerdown)="keepPointerToTrailing($event)"
  (keydown)="keepKeyToTrailing($event)"
  (keyup)="keepKeyToTrailing($event)"
>
  <ng-content select="[slot=trailing]" />
</div>
