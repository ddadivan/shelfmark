<ui-dialog [title]="config.title" [closeLabel]="config.closeLabel">
  <p class="ui-confirm-dialog__text" [id]="config.textId">{{ config.message }}</p>
  <ui-button slot="footer" variant="secondary" (click)="answer(false)">{{
    config.cancelLabel
  }}</ui-button>
  <ui-button
    slot="footer"
    [variant]="config.destructive ? BUTTON_VARIANT.Danger : BUTTON_VARIANT.Primary"
    (click)="answer(true)"
    >{{ config.confirmLabel }}</ui-button
  >
</ui-dialog>
